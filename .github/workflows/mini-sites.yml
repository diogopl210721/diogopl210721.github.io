name: Mini sites

# Gera as páginas www.ddsinovacao.com.br/<nome> dos mini sites publicados no DDS Avaliações.
# Enquanto a página não é gerada, o link já funciona pela 404.html do site.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: mini-sites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gera as páginas publicadas
        run: node .github/mini-sites/sync.mjs
        env:
          SUPABASE_URL: https://kwadhzmdaakxkztggigm.supabase.co
          # Chave pública (a mesma usada no navegador); só lê páginas publicadas.
          SUPABASE_KEY: sb_publishable_8kEj3zY3ebOMZDYutUBv5A_wbLELNIM
      - name: Publica as mudanças
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mini sites: atualiza páginas publicadas"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            sleep 5
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
