<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cérebro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: tela cheia com o cérebro 3D no centro; dossiê à esquerda no desktop e acima da barra no celular; régua de regiões na borda direita; dock HUD embaixo; nada no topo. */
:root {
  --bg: #02070c;
  --glow: #0a2537;
  --ink: #d9f4ff;
  --ink-soft: #b4d9ea;
  --dim: #6d92a6;
  --cyan: #3fd9ff;
  --line: rgba(110, 200, 255, 0.22);
  --glass: rgba(5, 16, 26, 0.82);
  --field: rgba(63, 217, 255, 0.05);
  --grid: rgba(80, 180, 255, 0.055);
  --display: 'Chakra Petch', 'Rajdhani', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  font: 15px/1.5 var(--body);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(ellipse at 50% 42%, var(--glow) 0%, #051420 42%, var(--bg) 100%);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#grid {
  position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
  mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.grabbing { cursor: grabbing; }
#cv.point { cursor: pointer; }

.hud {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 2px;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.hud::before, .hud::after {
  content: ""; position: absolute; width: 12px; height: 12px;
  border: 2px solid var(--cyan); pointer-events: none;
}
.hud::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.hud::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

/* régua de regiões */
#rail {
  position: fixed; z-index: 5;
  right: max(6px, env(safe-area-inset-right, 0px));
  top: calc((100% - var(--dock-h, 110px)) / 2);
  transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end;
}
#rail button { position: relative; width: 30px; height: 28px; display: grid; place-items: center; background: transparent; border: 0; padding: 0; cursor: pointer; }
#rail i { width: 9px; height: 9px; border-radius: 50%; display: block; transition: transform .15s ease, box-shadow .15s ease; }
#rail i.dia { border-radius: 0; transform: rotate(45deg) scale(.85); }
#rail button:hover i { transform: scale(1.35); }
#rail button:hover i.dia { transform: rotate(45deg) scale(1.2); }
#rail button[aria-pressed="true"] i { box-shadow: 0 0 0 3px rgba(217, 244, 255, .28); transform: scale(1.4); }
#rail button[aria-pressed="true"] i.dia { transform: rotate(45deg) scale(1.1); }
#rail .rn {
  position: absolute; right: 34px; top: 50%; transform: translateY(-50%); padding: 5px 8px;
  font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .15s ease;
}
#rail button:hover .rn, #rail button:focus-visible .rn, #rail button[aria-pressed="true"] .rn { opacity: 1; }
#rail .rt {
  width: 30px; height: 26px; margin-bottom: 6px; font: 500 11px/1 var(--mono); letter-spacing: .02em; color: var(--dim);
  border: 1px solid var(--line); border-radius: 2px;
}
#rail .rt[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); background: rgba(63, 217, 255, .1); }
@media (max-width: 979px) { body.po #rail { display: none; } }

/* dossiê */
#panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--dock-h, 110px) + 10px);
  max-width: 748px; margin-inline: auto; box-sizing: border-box;
  max-height: min(48vh, 480px);
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(8px);
  transition: opacity .25s ease, transform .25s ease;
}
#panel.in { opacity: 1; transform: none; }
#pb { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 18px; }
@media (min-width: 980px) {
  #panel {
    left: max(24px, env(safe-area-inset-left, 0px)); right: auto; margin-inline: 0; width: 430px;
    bottom: calc(var(--dock-h, 110px) + 14px);
    max-height: calc(100% - var(--dock-h, 110px) - 44px);
  }
}
.p-head { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.dia { border-radius: 0; transform: rotate(45deg) scale(.9); }
.tag { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.date { margin-left: auto; font: 400 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.tbtn {
  height: 28px; padding: 0 10px; background: transparent; border: 1px solid var(--line); border-radius: 2px;
  font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--cyan); cursor: pointer;
}
.tbtn:hover { border-color: var(--cyan); background: rgba(63, 217, 255, .1); }
.date + .tbtn, .tag + .tbtn { margin-left: auto; }
.date ~ .tbtn { margin-left: 0; }
.close {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center;
  background: transparent; border: 1px solid transparent; color: var(--dim); cursor: pointer; border-radius: 2px;
}
.close:hover { color: var(--cyan); border-color: var(--line); }
.p-title { margin: 4px 0 4px; font: 600 24px/1.18 var(--display); letter-spacing: .01em; text-wrap: balance; }
.p-meta { margin: 0 0 2px; font: 400 11px/1.4 var(--mono); letter-spacing: .04em; color: var(--dim); }
.p-body { margin: 0; max-width: 62ch; color: var(--ink-soft); white-space: pre-line; overflow-wrap: anywhere; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.sl { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }
.sm { font: 400 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--dim); }
.bar { height: 2px; background: var(--line); margin: -2px 0 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width .25s ease; }

.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: flex; gap: 12px; padding-bottom: 14px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 12px; top: 28px; bottom: 2px; width: 1px; background: var(--line); }
.sbox {
  flex: none; width: 25px; height: 25px; display: grid; place-items: center; padding: 0;
  font: 500 11px/1 var(--mono); color: var(--cyan); background: var(--field); border: 1px solid var(--cyan); border-radius: 2px; cursor: pointer;
}
.sbox:hover { background: rgba(63, 217, 255, .18); }
.step.done .sbox { background: var(--cyan); color: #02222c; }
.stxt { min-width: 0; padding-top: 2px; }
.st { font: 500 15px/1.3 var(--body); color: var(--ink); overflow-wrap: anywhere; }
.sd { margin-top: 3px; font-size: 13.5px; line-height: 1.45; color: var(--dim); overflow-wrap: anywhere; }
.step.done .st { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(109, 146, 166, .6); }

.conn {
  display: flex; flex-direction: column; align-items: stretch; gap: 3px; width: 100%; padding: 10px 2px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; cursor: pointer;
}
.conn:hover { background: rgba(63, 217, 255, .06); }
.ct { display: flex; align-items: center; gap: 8px; font: 600 14px/1.3 var(--display); letter-spacing: .01em; }
.cd { margin-left: auto; padding-left: 10px; font: 400 10.5px/1 var(--mono); letter-spacing: .06em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.cr { padding-left: 16px; font-size: 13.5px; line-height: 1.45; color: var(--dim); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.addbtn {
  min-height: 36px; padding: 6px 12px; background: transparent; border: 1px dashed var(--line); border-radius: 2px;
  font: 400 13px/1.2 var(--body); color: var(--ink-soft); cursor: pointer;
}
.addbtn:hover { border-color: var(--cyan); color: var(--cyan); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 4px 11px;
  font: 400 13px/1.2 var(--body); color: var(--ink); text-align: left;
  background: rgba(63, 217, 255, 0.04); border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
}
.chip:hover { border-color: var(--cyan); background: rgba(63, 217, 255, 0.1); }

.ans { margin-top: 6px; padding: 12px; background: var(--field); border: 1px solid var(--line); }
.ans .ah { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ans .at { font: 600 17px/1.25 var(--display); }
.ans .p-body { margin-bottom: 12px; font-size: 14px; }
.ans .tbtn { margin-left: auto; flex: none; }
.res {
  display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 40px; padding: 8px 4px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--ink);
  text-align: left; cursor: pointer; font: 400 14px/1.35 var(--body);
}
.res:hover { background: rgba(63, 217, 255, 0.06); }
.res .dot { transform: translateY(-1px); }
.res .dot.dia { transform: translateY(-1px) rotate(45deg) scale(.9); }
.res .rd { flex: none; min-width: 64px; font: 400 10.5px/1.35 var(--mono); letter-spacing: .04em; color: var(--dim); text-transform: uppercase; }
.res b { font: 600 14px/1.35 var(--display); flex: none; }
.res span.sn { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: var(--dim); }

/* edição */
.fld { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.fld label, .lrow label { font: 500 10px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.fld input, .fld textarea, .fld select, .lrow input {
  width: 100%; box-sizing: border-box; padding: 10px 12px; font: 400 16px/1.4 var(--body); color: var(--ink);
  background: var(--field); border: 1px solid var(--line); border-radius: 2px; outline: 0;
}
.fld textarea { resize: vertical; min-height: 72px; }
.fld input:focus, .fld textarea:focus, .fld select:focus, .lrow input:focus { border-color: var(--cyan); }
.fld .err { margin: 0; font-size: 12.5px; color: #ff8c7a; }
.lrow { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.btns { display: flex; gap: 8px; margin-top: 18px; }
.pbtn {
  min-height: 42px; padding: 0 18px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  color: var(--cyan); background: rgba(63, 217, 255, .14); border: 1px solid var(--cyan); border-radius: 2px;
}
.pbtn:hover { background: rgba(63, 217, 255, .26); }
.pbtn.ghost { color: var(--ink-soft); background: transparent; border-color: var(--line); }
.pbtn.ghost:hover { border-color: var(--ink-soft); }

/* dock */
body::after {
  content: ""; position: fixed; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
  height: calc(var(--dock-h, 110px) + 56px);
  background: linear-gradient(180deg, rgba(2,7,12,0) 0%, rgba(2,7,12,.78) 55%, rgba(2,7,12,.94) 100%);
}
#panel { z-index: 3; }
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  max-width: 780px; margin-inline: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
#chips { display: flex; flex-wrap: wrap; gap: 6px; }
#chips:empty { display: none; }
.file {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 4px 2px 10px;
  font: 400 11.5px/1.2 var(--mono); color: var(--ink-soft);
  background: rgba(63,217,255,.07); border: 1px solid var(--line); border-radius: 2px;
}
.file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file button { width: 28px; height: 28px; background: transparent; border: 0; color: var(--dim); cursor: pointer; font-size: 16px; line-height: 1; }
.file button:hover { color: var(--cyan); }

#status {
  display: flex; align-items: center; gap: 12px; min-height: 20px; padding: 0 4px;
  font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
}
#stx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
#stx::before {
  content: ""; width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan), 0 0 0 3px rgba(63,217,255,.15); animation: blink 2.4s ease-in-out infinite;
}
.short { display: none; }
#stx .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.kh { flex: none; display: flex; gap: 6px; color: rgba(109,146,166,.8); }
.kh kbd { padding: 3px 5px; font: 500 9.5px/1 var(--mono); letter-spacing: .06em; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 2px; background: rgba(63,217,255,.05); }
@keyframes blink { 50% { opacity: .35; } }
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(420%); } }

/* console de comando */
#form {
  --cut: 14px;
  position: relative; padding: 1px; min-height: 58px; box-sizing: border-box;
  background: linear-gradient(115deg, rgba(63,217,255,.95), rgba(63,217,255,.18) 28%, rgba(138,164,255,.16) 72%, rgba(63,217,255,.75));
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  filter: drop-shadow(0 0 14px rgba(63,217,255,.18));
  transition: filter .2s ease;
}
#form:focus-within { filter: drop-shadow(0 0 20px rgba(63,217,255,.42)); }
.cin {
  position: relative; display: flex; align-items: center; gap: 4px; min-height: 56px; box-sizing: border-box; padding: 0 8px 0 10px;
  background:
    linear-gradient(90deg, rgba(63,217,255,.07), transparent 40%),
    linear-gradient(180deg, rgba(9,29,45,.96), rgba(3,11,19,.97));
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px));
}
.scan { position: absolute; left: 0; top: 0; width: 24%; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: sweep 4.5s linear infinite; }
#mode {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px;
  font: 500 10.5px/1 var(--mono); letter-spacing: .16em; color: var(--cyan); cursor: pointer;
  background: rgba(63,217,255,.09); border: 1px solid rgba(63,217,255,.38); border-radius: 2px;
  transition: background .15s ease, border-color .15s ease;
}
#mode:hover { background: rgba(63,217,255,.18); border-color: var(--cyan); }
#mode svg { width: 15px; height: 15px; flex: none; }
#mode .i-ask { display: none; }
#mode[data-m="find"] .i-ask { display: block; }
#mode[data-m="find"] .i-note { display: none; }
#mode[data-m="find"] { color: #a9b8ff; background: rgba(138,164,255,.12); border-color: rgba(138,164,255,.5); }
.pr { flex: none; margin-left: 6px; font: 500 16px/1 var(--mono); color: var(--cyan); opacity: .75; }
#q {
  flex: 1; min-width: 0; padding: 18px 8px; background: transparent; border: 0; outline: 0; resize: none;
  max-height: 120px; font: 400 16px/1.3 var(--body); color: var(--ink); caret-color: var(--cyan);
}
.file i { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-style: normal; }
.file.ok i { color: #6fe3a8; } .file.er i { color: #ff8c7a; }
body.drag #form { filter: drop-shadow(0 0 26px rgba(63,217,255,.8)); }
#q::placeholder { color: rgba(109,146,166,.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; background: transparent; border: 0; border-radius: 2px; color: var(--ink-soft); cursor: pointer; }
.ibtn:hover { color: var(--cyan); background: rgba(63,217,255,.09); }
.ibtn[aria-disabled="true"] { opacity: .28; cursor: default; }
.ibtn[aria-disabled="true"]:hover { background: transparent; color: var(--ink-soft); }
#send {
  width: 44px; height: 44px; margin-left: 4px; color: var(--cyan);
  background: rgba(63,217,255,.1); border: 1px solid rgba(63,217,255,.4);
  border-radius: 2px;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
#send:hover { background: rgba(63,217,255,.22); }
#form.ready #send { color: #022029; background: linear-gradient(135deg, #7ff0ff, #2bc4ee); border-color: transparent; box-shadow: 0 0 18px rgba(63,217,255,.7); }
@media (max-height: 520px) { .kh { display: none; } .p-title { font-size: 19px; } }
@media (max-width: 560px) {
  .kh { display: none; }
  .pr { display: none; }
  #mode .ml { display: none; }
  #mode { padding: 0 9px; }
}
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
#q:focus-visible, .fld input:focus-visible, .fld textarea:focus-visible, .fld select:focus-visible, .lrow input:focus-visible { outline: 0; }

@media (max-width: 560px) {
  .long { display: none; }
  .short { display: inline; }
  .p-title { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  #panel, .bar i, #rail i { transition: none; }
  .scan { animation: none; display: none; }
  #stx::before { animation: none; }
}
</style>
</head>
<body>

<h1 class="sr">Cérebro</h1>
<div id="grid"></div>
<canvas id="cv" role="img" aria-label="Cérebro de neurônios e sinapses. Arraste para girar, use a roda ou pinça para ampliar, toque em um neurônio para abrir o pensamento."></canvas>

<nav id="rail" aria-label="Regiões do cérebro"></nav>
<section id="panel" class="hud" hidden aria-live="polite"><div id="pb"></div></section>

<div id="dock">
  <div id="chips"></div>
  <div id="status"><span id="stx"></span><span class="kh"><kbd>ENTER ↵</kbd><kbd>SHIFT + ENTER</kbd></span></div>
  <form id="form" autocomplete="off"><div class="cin">
      <i class="scan"></i>
      <button type="button" id="mode" data-m="note" aria-label="Modo anotar. Toque para trocar para perguntar.">
        <svg class="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
        <svg class="i-ask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <span class="ml" id="modeL">ANOTAR</span>
      </button>
      <span class="pr" aria-hidden="true">›</span>
      <textarea id="q" rows="1" enterkeyhint="send" placeholder="Escreva ou anexe um arquivo…" aria-label="Campo de captura e pergunta"></textarea>
      <button type="button" id="clip" class="ibtn" aria-label="Anexar arquivos">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.2-8.2"/></svg>
      </button>

/* ---------- geração do cérebro ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

function dir() { const z = rand() * 2 - 1, a = rand() * TAU, r = Math.sqrt(1 - z * z); return [r * Math.cos(a), r * Math.sin(a), z]; }

  for (;;) {
    const d = dir(), s = rand() < .5 ? -1 : 1;
    let k = rand() < .72 ? .84 + rand() * .16 : .25 + rand() * .6;
    k *= 1 + .07 * Math.sin(d[0] * 6 + d[1] * 4) * Math.cos(d[2] * 7);
    const x = s * .34 + d[0] * .58 * k;
    let y = .06 + d[1] * .62 * k;
    const z = d[2] * .98 * k;
    if (y < .06) y = .06 + (y - .06) * .72;
    if (s * x < .05) continue;
    return [x, y, z];
  }
}
function tintFor(x, y, z) {
  let bc = 'eu', bd = 1e9;
  for (const k of ORDER) {
    const c = REGION[k];
    const cx = MIRROR.has(k) ? (x < 0 ? -1 : 1) * c[0] : c[0];
    const d = (x - cx) ** 2 + (y - c[1]) ** 2 + (z - c[2]) ** 2;
    if (d < bd) { bd = d; bc = k; }
  }
  const r = CATS[bc].rgb;
  return [0, 1, 2].map(i => Math.round(ICE[i] * .6 + r[i] * .4));
}
const nodes = [];
function addNodeAt(x, y, z) { const n = { i: nodes.length, x, y, z, note: null, tint: tintFor(x, y, z) }; nodes.push(n); return n; }
for (let k = 0; k < 330; k++) { const p = hemi(); addNodeAt(p[0], p[1], p[2]); }
for (let k = 0; k < 44; k++) { const d = dir(); addNodeAt(d[0] * .42, -.52 + Math.min(d[1], .6) * .22, -.62 + d[2] * .3); }
for (let k = 0; k < 12; k++) { const t = k / 11; addNodeAt((rand() - .5) * .1, -.5 - t * .42, -.2 - t * .12 + (rand() - .5) * .06); }

const ambEdges = [], linkEdges = [];
(function () {
  const seen = new Set();
  for (const n of nodes) {
    const ds = [];
    for (const m of nodes) { if (m !== n) ds.push([(n.x - m.x) ** 2 + (n.y - m.y) ** 2 + (n.z - m.z) ** 2, m]); }
    ds.sort((p, q) => p[0] - q[0]);
    for (let k = 0; k < 3; k++) {
      if (ds[k][0] > .1) break;
      const m = ds[k][1], key = n.i < m.i ? n.i + '_' + m.i : m.i + '_' + n.i;
      if (seen.has(key)) continue;
      seen.add(key); ambEdges.push({ a: n, b: m, link: false });
    }
  }
})();

const notes = [], noteById = {}, dirty = new Set();
function pickNode(cat, idx) {
  const c = REGION[cat].slice();
  if (MIRROR.has(cat) && idx % 2) c[0] = -c[0];
  const j = [c[0] + (rand() - .5) * .35, c[1] + (rand() - .5) * .3, c[2] + (rand() - .5) * .35];
  let best = null, bd = 1e9;
  for (const n of nodes) {
    if (n.note) continue;
    let near = false;
    for (const m of notes) { if ((n.x - m.node.x) ** 2 + (n.y - m.node.y) ** 2 + (n.z - m.node.z) ** 2 < .02) { near = true; break; } }
    if (near) continue;
    const d = (n.x - j[0]) ** 2 + (n.y - j[1]) ** 2 + (n.z - j[2]) ** 2;
    if (d < bd) { bd = d; best = n; }
  }
  if (!best) best = addNodeAt(j[0], j[1], j[2]);
  return best;
}
function index(n) {
  n.tt = stemSet(n.title);
  n.tb = stemSet([n.body, n.why, n.steps.map(s => s.t + ' ' + s.d).join(' ')].join(' '));
}

    reg: o.reg || '', parent: o.parent || '', user: !!o.user, links: new Map(), edges: [], node: null
  };
  n.node = pickNode(o.cat, idx);

}
function setReason(a, id, r) { a.links.set(id, r); noteById[id].links.set(a.id, r); }
function link(a, b, reason) {
  if (!a || !b || a === b) return;
  if (a.links.has(b.id)) { if (reason) setReason(a, b.id, reason); return; }
  a.links.set(b.id, reason || ''); b.links.set(a.id, reason || '');
  const A = a.node, B = b.node;
  const e = { a: A, b: B, link: true, c: [(A.x + B.x) / 2 * 1.16, (A.y + B.y) / 2 * 1.16, (A.z + B.z) / 2 * 1.16] };
  linkEdges.push(e); a.edges.push(e); b.edges.push(e);

}

function related(text) {
  const ts = new Set(toks(text).map(t => t.slice(0, 5)));
  const res = [];
  notes.forEach(n => {
    if (CATS[n.cat].ent) return;
    let s = 0;
    ts.forEach(t => { if (n.tt.has(t)) s += 2; else if (n.tb.has(t)) s += 1; });
    if (s >= 2) res.push([s, n]);
  });
  res.sort((a, b) => b[0] - a[0]);
  return res.slice(0, 3).map(r => r[1]);
}

/* análise de uma anotação: região, data, pessoas e lugares */
const NOTPERSON = new Set(['hoje', 'ontem', 'anteontem', 'domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'].concat(MONTH));
function analyze(text, files, extra) {
  extra = extra || '';
  const nt = norm(text), nf = norm(text + ' ' + extra);
  const ents = notes.filter(n => CATS[n.cat].ent && hasWord(nf, norm(n.title)));
  const newEnts = [];
  GAZ.forEach(g => { if (!findByTitle(g[0]) && hasWord(nt, norm(g[0]))) newEnts.push({ name: g[0], cat: 'lug' }); });
  const re = /\b(?:com|e|para|falei com|conheci)\s+(?:o|a|os|as)\s+([A-ZÀ-Ý][a-zà-ÿ]{2,})/g;
  let m;
  while ((m = re.exec(text))) {
    const nm = m[1], k = norm(nm);
    if (NOTPERSON.has(k) || findByTitle(nm) || GAZ.some(g => norm(g[0]) === k) || newEnts.some(e => norm(e.name) === k)) continue;
    newEnts.push({ name: nm, cat: 'pes' });
  }
  const full = (text + ' ' + extra).slice(0, 8000);
  return { cat: detectCat(full, files), when: detectWhen(text), ents: ents, rel: related(full).filter(n => ents.indexOf(n) < 0), newEnts: newEnts };
}
function makeEntity(spec) {
  let e = findByTitle(spec.name);
  if (e) return e;
  e = addNote({ id: 'e' + Date.now().toString(36) + Math.floor(Math.random() * 999), cat: spec.cat, title: spec.name, body: 'Criado automaticamente a partir de uma anotação. Edite para adicionar detalhes.', date: '', user: true }, notes.length);
  dirty.add(e.id); flashes.push({ n: e, t: performance.now() });
  const g = GAZ.find(x => x[0] === spec.name);
  if (g && g[1]) {
    const P = makeEntity({ name: g[1], cat: 'lug' });
    e.parent = P.id; link(e, P, e.title + ' fica em ' + P.title + '.'); dirty.add(P.id);
  }
  return e;
}

/* pergunta ao cérebro: data, pessoa, lugar e assunto */
function ask(v) {
  const nv = norm(v);
  const dq = queryDate(nv);
  const how = /\b(como|passo a passo|tutorial|procedimento|processo)\b/.test(nv);
  const ents = notes.filter(n => CATS[n.cat].ent && hasWord(nv, norm(n.title)));
  const qt = nv.split(/[^a-z0-9]+/).filter(t => t.length >= 3 && !STOP.has(t) && !QSTOP.has(t) && !MONTHSET.has(t) && !/^\d+$/.test(t));
  const scope = new Set();
  ents.forEach(e => { scope.add(e.id); descendants(e).forEach(d => scope.add(d.id)); });
  const res = [];
  if (dq || ents.length || qt.length) {
    notes.forEach(n => {
      let s = 0;
      if (dq) { if (!overlap(rangeOf(n.date), dq.r)) return; s += 5; }
      if (ents.length) {
        const hit = scope.has(n.id) ? 6 : (Array.from(n.links.keys()).some(id => scope.has(id)) ? 4 : 0);
        if (!hit) return;
        s += hit;
      }
      if (qt.length) {
        const hay = norm([n.title, n.body, n.why, n.steps.map(x => x.t + ' ' + x.d).join(' '), CATS[n.cat].name].join(' ')), th = norm(n.title);
        let mt = 0;
        qt.forEach(t => { if (hay.includes(t) || (t.length > 5 && hay.includes(t.slice(0, t.length - 2)))) { mt++; s += th.includes(t) ? 3 : 2; } });
        if (!dq && !ents.length && mt === 0) return;
        if (mt === qt.length) s += 3;
      }
      if (how && n.steps.length) s += 2;
      res.push({ n: n, s: s });
    });
  }
  if (dq) res.sort((a, b) => (rangeOf(a.n.date)[0] - rangeOf(b.n.date)[0]) || (a.n.time < b.n.time ? -1 : a.n.time > b.n.time ? 1 : 0));
  else res.sort((a, b) => b.s - a.s);
  const when = /\b(que dia|quando|qual dia|qual a data|que data)\b/.test(nv);
  return { res: res.slice(0, 30).map(r => r.n), dq: dq, how: how, when: when, ents: ents, qt: qt };
}

  const ids = Array.from(n.links.keys()).filter(id => noteById[id]);

    if (og.children.length) sel.append(og);
  });
  const ar = el('input'); ar.type = 'text'; ar.placeholder = 'Por que se ligam?';
  kids.push(sec('Nova ligação'), fld('Pensamento', 'ed-add', sel), fld('Motivo', 'ed-add-r', ar));

  const btns = el('div', 'btns');
  const ok = el('button', 'pbtn', 'Salvar'); ok.type = 'button';
  const no = el('button', 'pbtn ghost', 'Cancelar'); no.type = 'button';

  ok.addEventListener('click', () => {
    let w = { date: n.date, time: n.time };
    if (!ent) {
      w = parseWhen(dt.value);
      if (!w) { dtErr.hidden = false; dt.focus(); return; }
    }
    n.title = ti.value.trim() || n.title; n.body = bo.value.trim();
    if (!ent) {
      n.why = wy.value.trim(); n.date = w.date; n.time = w.time;
      const ns = parseSteps(st.value);
      if (JSON.stringify(ns) !== JSON.stringify(n.steps)) { n.steps = ns; delete checks[n.id]; saveChecks(); }
    }
    ids.forEach(id => { const inp = $('ed-r-' + id); if (inp) setReason(n, id, inp.value.trim()); });
    if (sel.value) link(n, noteById[sel.value], ar.value.trim());
    index(n); dirty.add(n.id); save(); renderNote(n); renderStatus();
  });
  btns.append(ok, no); kids.push(btns);
  showPanel(kids);
  if (focusId) requestAnimationFrame(() => { const f = $(focusId); if (f) { f.scrollIntoView({ block: 'nearest' }); f.focus(); } });
}

function rowBtn(n, dateTxt) {

function renderAsk(r, v) {
  const list = r.res;

      b.addEventListener('click', () => select(m)); row.append(b);

    kids.push(row);
  }
  showPanel(kids);
}
function showExamples() {

function select(n) {
  S.sel = n; S.zt = Math.max(S.zt, 1.8);

function deselect() {

function renderStatus() {

    el('span', 't short', 'EXEMPLO · ' + notes.length + ' NÓS · ' + linkEdges.length + ' LIGAÇÕES'));
}

/* régua de regiões e rótulos */
(function () {
  const tg = el('button', 'rt', 'Aa'); tg.type = 'button'; tg.setAttribute('aria-pressed', 'true'); tg.setAttribute('aria-label', 'Mostrar nomes dos neurônios');

function runSearch() {
  const v = q.value.trim();
  S.preview = null; S.previewText = null;
  if (!v) {
    S.matches = null; S.chain = null; S.sel = null; S.zt = 1;
    if (mode === 'find') showExamples(); else hidePanel();
    renderStatus(); return;
  }
  const r = ask(v);
  S.matches = new Set(r.res.map(n => n.id)); S.chain = new Set();
  r.res.forEach(n => n.links.forEach((_, id) => { if (!S.matches.has(id)) S.chain.add(id); }));
  S.sel = null; S.zt = 1;
  renderAsk(r, v); renderStatus();
}
function runPreview() {
  const v = q.value.trim();
  if (v.length < 3 && !files.length) { S.preview = null; S.previewText = null; renderStatus(); return; }
  if (v && !files.length && isQuestion(v)) { S.preview = null; S.previewText = 'PARECE UMA PERGUNTA · ENTER PARA PROCURAR NO CÉREBRO'; renderStatus(); return; }
  const A = analyze(v, files, files.map(f => f.text || '').join(' ').slice(0, 8000));
  S.preview = new Set(A.rel.concat(A.ents).map(n => n.id));
  const parts = ['→ ' + CATS[A.cat].name.toUpperCase()];
  if (A.when) parts.push(fmtWhen(A.when.date, A.when.time).toUpperCase());
  const lk = A.ents.concat(A.rel).slice(0, 3).map(n => n.title);
  parts.push(lk.length ? 'LIGA COM ' + lk.join(', ').toUpperCase() : 'SEM LIGAÇÕES AINDA');
  if (A.newEnts.length) parts.push('NOVOS: ' + A.newEnts.map(e => e.name).join(', ').toUpperCase());
  S.previewText = parts.join(' · ');
  renderStatus();
}
function fit() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 120) + 'px'; form.classList.toggle('ready', !!q.value.trim() || files.length > 0); }
q.addEventListener('input', () => { fit(); if (mode === 'find') runSearch(); else runPreview(); });
q.addEventListener('keydown', e => {

function setPh() {

function renderChips() {

  files.forEach((f, i) => {
    const c = el('div', 'file'); const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', 'Remover ' + f.name); b.textContent = '×';

    c.append(el('span', null, f.name), el('i', null, f.state === 'lendo' ? 'lendo…' : f.state === 'ok' ? f.text.length.toLocaleString('pt-BR') + ' car.' : f.state === 'vazio' ? 'sem texto' : f.state === 'erro' ? 'erro' : ''), b); chips.append(c);

clip.addEventListener('click', () => { if (mode === 'note') fileIn.click(); });
/* leitura de arquivos no próprio navegador */
const LIBS = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  docx: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const libP = {};
function loadLib(k) {
  if (!libP[k]) libP[k] = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = LIBS[k]; sc.onload = res; sc.onerror = () => { libP[k] = null; rej(new Error('lib')); }; document.head.append(sc);
  });
  return libP[k];
}
const MAXCH = 20000;
async function extractText(f) {
  const n = f.name.toLowerCase();
  if (f.size > 15 * 1024 * 1024) throw new Error('grande');
  if (/\.(txt|md|csv|json)$/.test(n)) return await f.text();
  if (/\.pdf$/.test(n)) {
    await loadLib('pdf');
    const L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await L.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    let out = '';
    for (let p = 1; p <= doc.numPages && out.length < MAXCH; p++) {
      const c = await (await doc.getPage(p)).getTextContent();
      let y = null, line = '';
      c.items.forEach(it => {
        const yy = it.transform ? Math.round(it.transform[5]) : y;
        if (y !== null && Math.abs(yy - y) > 2) { out += line.trim() + '\n'; line = ''; }
        line += it.str + (it.hasEOL ? '\n' : ' '); y = yy;
      });
      out += line.trim() + '\n\n';
    }
    return out;
  }
  if (/\.docx$/.test(n)) {
    await loadLib('docx');
    return (await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value;
  }
  if (/\.xlsx?$/.test(n)) {
    await loadLib('xlsx');
    const wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(nm => 'Planilha ' + nm + '\n' + window.XLSX.utils.sheet_to_csv(wb.Sheets[nm]).split('\n').filter(r => r.replace(/[,;\s]/g, '')).slice(0, 300).join('\n')).join('\n\n');
  }
  return '';
}
function addFiles(list) {
  Array.from(list).forEach(f => {
    const it = { name: f.name, text: '', state: 'lendo' };
    files.push(it);
    extractText(f).then(t => {
      it.text = (t || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, MAXCH);
      it.state = it.text ? 'ok' : 'vazio';
    }).catch(() => { it.state = 'erro'; }).then(() => { renderChips(); if (mode === 'note') { runPreview(); if (!files.some(x => x.state === 'lendo')) showFilePanel(); } });
  });
  renderChips(); runPreview();
  if (!files.length) return;
  S.previewText = 'LENDO O ARQUIVO…'; renderStatus();
}
function showFilePanel() {
  if (!files.length) return;
  S.sel = null; S.zt = 1;
  const ex = files.map(f => f.text).join('\n\n'), A = analyze(q.value.trim(), files, ex.slice(0, 8000));
  const ok = files.filter(f => f.state === 'ok');
  const head = el('div', 'p-head');
  head.append(dotEl(A.cat), el('span', 'tag', ok.length ? 'Arquivo lido' : 'Arquivo anexado'), closeBtn(hidePanel));
  const kids = [head, el('h2', 'p-title', files.length === 1 ? files[0].name : files.length + ' arquivos')];
  const bad = files.filter(f => f.state !== 'ok');
  if (ok.length) kids.push(el('p', 'hint', ex.length.toLocaleString('pt-BR') + ' caracteres lidos · vai para ' + CATS[A.cat].name.toUpperCase() + (stepsFrom(ex).length ? ' · ' + stepsFrom(ex).length + ' passos encontrados' : '')));
  bad.forEach(f => kids.push(el('p', 'hint', f.name + ': ' + (f.state === 'vazio' ? 'não encontrei texto (imagem ou PDF escaneado). Será salvo só com o nome.' : 'não consegui ler este arquivo.'))));
  if (ex) { kids.push(sec('Prévia'), el('p', 'p-body', ex.slice(0, 420) + (ex.length > 420 ? '…' : ''))); }
  const lk = A.ents.concat(A.rel).slice(0, 5);
  if (lk.length) { kids.push(sec('Vai se ligar com')); const row = el('div', 'chips-row'); lk.forEach(m => { const b = el('span', 'chip'); b.append(dotEl(m.cat), el('span', null, m.title)); row.append(b); }); kids.push(row); }
  const btns = el('div', 'btns'), go = el('button', 'pbtn', 'Salvar no cérebro'), no = el('button', 'pbtn ghost', 'Remover');
  go.type = 'button'; no.type = 'button';
  go.addEventListener('click', submitNote);
  no.addEventListener('click', () => { files = []; renderChips(); hidePanel(); S.preview = null; S.previewText = null; renderStatus(); });
  btns.append(go, no); kids.push(btns);
  showPanel(kids);
}
fileIn.addEventListener('change', () => { addFiles(fileIn.files); fileIn.value = ''; });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { if (mode === 'note' && e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') > -1) { e.preventDefault(); document.body.classList.add('drag'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('drag'); if (ev === 'drop' && mode === 'note' && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); }));

function stepsFrom(t) {
  const m = t.split('\n').map(l => l.trim()).filter(l => /^(passo\s*)?\d{1,2}\s*[.):\-–]\s+\S/i.test(l));
  return m.length >= 3 ? m.slice(0, 20).map(l => ({ t: l.replace(/^(passo\s*)?\d{1,2}\s*[.):\-–]\s+/i, '').slice(0, 140), d: '' })) : [];
}
function makeNote(text, fs) {
  const extra = fs.map(f => f.text).join('\n\n');
  const A = analyze(text, fs, extra);
  const first = (text.split(/[.!?\n]/)[0] || '').trim();
  const base = fs.length ? fs[0].name.replace(/\.[^.]+$/, '') : '';
  const title = first ? (first.length > 48 ? first.slice(0, 46).trim() + '…' : first) : (base.length > 48 ? base.slice(0, 46) + '…' : base);
  let body = text;
  fs.forEach(f => { body += (body ? '\n\n' : '') + 'Arquivo: ' + f.name + (f.text ? '\n' + f.text : f.state === 'vazio' ? '\n(sem texto legível: se for escaneado ou imagem, a leitura por IA virá depois)' : ''); });
  const n = addNote({
    id: 'u' + Date.now().toString(36) + Math.floor(Math.random() * 99), cat: A.cat, title: title, body: body.slice(0, MAXCH + 400),
    steps: stepsFrom(extra),
    date: A.when ? A.when.date : TODAY, time: A.when ? A.when.time : '', reg: TODAY, user: true
  }, notes.length);
  A.rel.forEach(r => link(n, r, 'Falam de assuntos parecidos.'));
  const reasonFor = e => e.cat === 'lug' ? 'Aconteceu aqui.' : 'Esteve neste momento.';
  A.ents.forEach(e => link(n, e, reasonFor(e)));
  A.newEnts.forEach(sp => { const e = makeEntity(sp); link(n, e, reasonFor(e)); dirty.add(e.id); });
  flashes.push({ n: n, t: performance.now() });
  dirty.add(n.id);
  return n;
}
const isQuestion = v => /\?\s*$/.test(v) || /^(como|quando|que dia|qual|quais|onde|quem|o que|quanto|me mostre|mostre)\b/.test(norm(v));
function submitNote() {
  const text = q.value.trim();
  if (!text && !files.length) return;
  if (text && !files.length && isQuestion(text)) { setMode('find'); return; }
  if (files.some(f => f.state === 'lendo')) { S.previewText = 'AGUARDE: LENDO O ARQUIVO…'; renderStatus(); return; }
  const groups = (text || files.length === 1) ? [files.slice()] : files.map(f => [f]);
  let last = null;
  groups.forEach(g => { last = makeNote(text, g); });
  q.value = ''; fit(); files = []; renderChips();
  S.preview = null; S.previewText = null;
  save(); select(last);
  if (groups.length > 1) { S.previewText = groups.length + ' ARQUIVOS SALVOS NO CÉREBRO'; renderStatus(); }
}
form.addEventListener('submit', e => {
  e.preventDefault();
  if (mode === 'find') { if (q.value.trim() && S.matches && S.matches.size) { const f = noteById[Array.from(S.matches)[0]]; if (f) select(f); } return; }
  submitNote();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (editing && S.sel) { renderNote(S.sel); return; }
  if (q.value) { q.value = ''; fit(); if (mode === 'find') runSearch(); else runPreview(); }
  else if (S.sel) deselect();
});

const ro = new ResizeObserver(() => {
  dockH = dock.offsetHeight; panelOH = panel.hidden ? 0 : panel.offsetHeight;
  document.documentElement.style.setProperty('--dock-h', dockH + 'px');
});
ro.observe(dock); ro.observe(panel);

renderStatus(); setPh();
requestAnimationFrame(frame);
})();
