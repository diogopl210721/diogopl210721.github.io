<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060B14">
<meta name="robots" content="noindex">
<meta name="description" content="Escola da Torá: leitor bíblico com hebraico e grego, 344 mil ligações entre versículos, mapas com jornadas e o Binah, um segundo cérebro de estudo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060B14'/%3E%3Cpath d='M32 9 L53 45 H11 Z' fill='none' stroke='%2362B2E6' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 55 L11 19 H53 Z' fill='none' stroke='%23E8EEF7' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='3.5' fill='%23F2B648'/%3E%3C/svg%3E">
<title>Escola da Torá · app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: a study desk — text column in the middle, a "lupa" drawer on the right (bottom sheet on phones),
   the brain orb floating at the corner. Dark, deliberate: the brand's night blue with light that means something
   (gold = Hebrew & numbers, purple = rabbinic, cyan = the brain). */
:root{
  color-scheme: dark;
  --bg:#060B14; --bg2:#09111E; --panel:#0D1627; --raised:#132037; --hover:#17263F;
  --line:#1C2A43; --line2:#2A3B5C;
  --text:#E8EEF7; --soft:#B6C3D8; --muted:#7F90AB;
  --royal:#1B4F8C; --celeste:#2980B9; --sky:#62B2E6;
  --cyan:#3BE3F0; --gold:#F2B648; --purple:#B484F7; --green:#2FC79A; --coral:#FF8471; --sand:#D9A877; --rose:#EE86B4;
  --amber:#E9A43C; --red:#F07070;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-text:'Spectral',Georgia,'Times New Roman',serif;
  --f-heb:'Noto Serif Hebrew','SBL Hebrew','Times New Roman',serif;
  --f-grk:'Noto Serif','Gentium Plus','Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --navh:0px;
  --hover2:#0C1628; --orange:#FF9A3C; --on-primary:#FFFFFF; --top-a:#0A1324; --nav:#070D18;
  --cover-a:#0B1D33; --cover-b:#030812; --head-a:#F7E7B4; --head-b:#F2B648; --head-c:#62B2E6; --glow:#3BE3F0;
  --f-display:'Spectral',Georgia,'Times New Roman',serif;
}
/* Temas (seletor "Cores"): Noite é o padrão; cada tema redefine só os tokens. */
:root[data-tema="fogo"]{--bg:#0D0806; --bg2:#120B08; --panel:#1A100B; --raised:#24160F; --hover:#2C1B12; --hover2:#170E09; --line:#2B1B12; --line2:#43291B; --text:#F6ECE4; --soft:#D9C3B3; --muted:#A3897A; --royal:#B4441A; --celeste:#D9622B; --sky:#FF9F68; --cyan:#FFC15E; --gold:#FFCF5A; --purple:#E59CC4; --green:#6FD39B; --coral:#FF8A65; --sand:#E3B184; --rose:#F28DB2; --amber:#F2A93B; --red:#FF6B5B; --orange:#FF8A3D; --on-primary:#FFF7F0; --top-a:#1A0E08; --nav:#120A06; --cover-a:#2A1209; --cover-b:#0A0503; --head-a:#FFE6B0; --head-b:#FF9A3C; --head-c:#E2452B; --glow:#FF8A3D;}
:root[data-tema="galileia"]{--bg:#041219; --bg2:#06171F; --panel:#0A212C; --raised:#0F2C3A; --hover:#133545; --hover2:#081B24; --line:#123040; --line2:#1D4558; --text:#E5F4F6; --soft:#B2D2D8; --muted:#7AA0AA; --royal:#0F6E7E; --celeste:#178C9C; --sky:#5ED0E2; --cyan:#62F2D8; --gold:#F2C55C; --purple:#A8A6FF; --green:#4FD6A0; --coral:#FF8C7A; --sand:#D8B68A; --rose:#F08DB8; --amber:#E9B23C; --red:#F27474; --orange:#FFA155; --on-primary:#F2FFFF; --top-a:#062029; --nav:#041820; --cover-a:#073040; --cover-b:#020B10; --head-a:#D9FFF6; --head-b:#62F2D8; --head-c:#F2C55C; --glow:#62F2D8;}
:root[data-tema="tabernaculo"]{--bg:#0C0814; --bg2:#110B1B; --panel:#180F26; --raised:#221633; --hover:#2A1B3E; --hover2:#140D20; --line:#271B3A; --line2:#3D2A56; --text:#F2EBF9; --soft:#CFC0E2; --muted:#9A88B4; --royal:#6A2FC2; --celeste:#8150D6; --sky:#9DB8FF; --cyan:#7FD4FF; --gold:#F5C451; --purple:#C792FF; --green:#5ED3A2; --coral:#FF7A8A; --sand:#DDB48A; --rose:#FF5C7A; --amber:#EDB040; --red:#FF6070; --orange:#FF9150; --on-primary:#FFFFFF; --top-a:#170D24; --nav:#0F0A18; --cover-a:#24123D; --cover-b:#07040D; --head-a:#FFE9B0; --head-b:#C792FF; --head-c:#FF5C7A; --glow:#C792FF;}
:root[data-tema="pergaminho"]{--bg:#F3EBDC; --bg2:#EEE3CF; --panel:#FBF6EC; --raised:#F4EBDA; --hover:#EADDC6; --hover2:#EFE5D3; --line:#DDCDB1; --line2:#C8B390; --text:#2A2016; --soft:#54442F; --muted:#7F6C55; --royal:#1D4E89; --celeste:#2A69AC; --sky:#1E5E98; --cyan:#0B7A84; --gold:#94660C; --purple:#6B3FA0; --green:#1D7A55; --coral:#B5442D; --sand:#8A5A2B; --rose:#A3386A; --amber:#9C5F0B; --red:#B2281C; --orange:#B0560F; --on-primary:#FFFFFF; --top-a:#F8F1E3; --nav:#F6EEDF; --cover-a:#2B1E12; --cover-b:#120C06; --head-a:#5A3A12; --head-b:#94660C; --head-c:#1D4E89; --glow:#94660C; color-scheme:light;}
:root[data-tema="pergaminho"] :is(.fs,.hud-card,.thumb,.brief,.island,.neuro){--bg:#060B14; --bg2:#09111E; --panel:#0D1627; --raised:#132037; --hover:#17263F; --hover2:#0C1628; --line:#1C2A43; --line2:#2A3B5C; --text:#E8EEF7; --soft:#B6C3D8; --muted:#7F90AB; --royal:#1B4F8C; --celeste:#2980B9; --sky:#62B2E6; --cyan:#3BE3F0; --gold:#F2B648; --purple:#B484F7; --green:#2FC79A; --coral:#FF8471; --sand:#D9A877; --rose:#EE86B4; --amber:#E9A43C; --red:#F07070; --orange:#FF9A3C; --on-primary:#FFFFFF; --top-a:#0A1324; --nav:#070D18; --cover-a:#0B1D33; --cover-b:#030812; --head-a:#F7E7B4; --head-b:#F2B648; --head-c:#62B2E6; --glow:#3BE3F0; color-scheme:dark;color:var(--text)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--top-a),var(--bg));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-text);font-weight:600;font-size:19px;letter-spacing:.01em;line-height:1.1}
.brand i{display:block;font-style:normal;font-family:var(--f-heb);font-size:13px;color:var(--soft);line-height:1.2}
.search{flex:1 1 280px;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:6px 6px 6px 14px;min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:var(--royal);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.cal{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.cal .hd{font-family:var(--f-heb);color:var(--gold)}
.cal .pa{color:var(--soft)}
nav.tabs{display:flex;gap:4px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab svg{opacity:.85}
.tab[aria-selected="true"]{color:var(--text);background:var(--raised)}
.tab:hover{color:var(--text)}

/* ---------- main + drawer ---------- */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.stage.with-panel{grid-template-columns:minmax(0,1fr) 420px}
.view{display:flex;flex-direction:column;overflow-y:auto;min-height:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
@keyframes hintfade{to{opacity:0;visibility:hidden}}
.panel-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.iconbtn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--hover)}
.scrim{display:none}

/* ---------- shared bits ---------- */
.wrap{max-width:780px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.h1{font-family:var(--f-text);font-weight:600;font-size:26px;letter-spacing:.005em;margin:0;text-wrap:balance}
.lede{color:var(--soft);margin:6px 0 0;max-width:65ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--royal);border-color:color-mix(in srgb,var(--royal) 70%,var(--on-primary));color:var(--on-primary)}
.btn.primary:hover{background:color-mix(in srgb,var(--royal) 88%,var(--on-primary))}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--panel);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.st-verificado{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--bg))}
.st-rascunho{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--bg))}
.st-contestado{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--bg))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ref{font-family:var(--f-mono);font-size:12.5px;color:var(--sky);background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--sky) 40%,var(--bg));text-underline-offset:3px}
.ref:hover{color:color-mix(in srgb,var(--sky) 60%,var(--text))}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.sec-title .n{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.03em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:18px;color:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--raised);border:1px solid var(--line2);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 8px 30px #0008}
.he{font-family:var(--f-heb);direction:rtl}
.gr{font-family:var(--f-grk)}

/* ---------- reader ---------- */
.rd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.rd-bar select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:14px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.rd-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.rd-title .h1{font-size:30px}
.rd-title .heb{font-family:var(--f-heb);color:var(--gold);font-size:18px}
.verses{display:flex;flex-direction:column}
.vr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;column-gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;scroll-margin-top:80px}
.vr:hover{background:var(--hover2)}
.vr.sel{background:color-mix(in srgb,var(--sky) 9%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sky) 35%,var(--bg))}
.vn{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:5px;text-align:right}
.vt{font-family:var(--f-text);font-size:18.5px;line-height:1.62;color:var(--text)}
.vside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:6px}
.xc{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.bd{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.orig{grid-column:2 / 4;margin-top:6px;line-height:2.1}
.orig.he{font-size:23px}
.orig.gr{font-size:18px;line-height:1.9}
.w{cursor:pointer;border-radius:4px;padding:0 2px}
.w:hover{background:color-mix(in srgb,var(--gold) 14%,var(--bg));color:var(--gold)}
.w.on{background:color-mix(in srgb,var(--gold) 22%,var(--bg));color:var(--gold)}
.inter{display:flex;flex-wrap:wrap;gap:6px 14px}
.inter.he{direction:rtl}
.iw{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:6px;padding:2px 4px}
.iw:hover,.iw.on{background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
.iw .o{font-size:22px;line-height:1.4}
.iw.gk .o{font-size:18px}
.iw .g{font-family:var(--f-ui);direction:ltr;font-size:11px;color:var(--soft);line-height:1.2;max-width:130px;text-align:center}
.iw .s{font-family:var(--f-mono);direction:ltr;font-size:10px;color:var(--muted)}
.ptitle{font-family:var(--f-text);font-style:italic;color:var(--soft);padding:2px 10px 8px 54px}
.rd-nav{display:flex;justify-content:space-between;margin-top:22px;gap:8px}
.results{display:flex;flex-direction:column;gap:2px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px}
.res:hover{background:var(--hover2)}
.res .r{font-family:var(--f-mono);font-size:12px;color:var(--sky)}
.res .t{font-family:var(--f-text);font-size:16px}
mark{background:color-mix(in srgb,var(--gold) 22%,var(--bg));color:var(--gold);border-radius:3px;padding:0 1px}

/* ---------- verse panel ---------- */
.p-ref{font-family:var(--f-text);font-size:22px;font-weight:600}
.p-text{font-family:var(--f-text);font-size:18px;line-height:1.6;margin:0}
.wordrow{display:flex;flex-wrap:wrap;gap:6px}
.wordrow.he{direction:rtl}
.wchip{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:2px 8px;font-size:20px;line-height:1.5}
.wchip.gk{font-family:var(--f-grk);font-size:16px}
.wchip.on{border-color:color-mix(in srgb,var(--gold) 50%,var(--bg));background:color-mix(in srgb,var(--gold) 14%,var(--bg));color:var(--gold)}
.wcard{border:1px solid color-mix(in srgb,var(--gold) 35%,var(--bg));background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 7%,var(--bg)),color-mix(in srgb,var(--gold) 3%,var(--bg)));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.wcard .big{font-size:34px;line-height:1.3;color:var(--gold)}
.wcard .big.gr{font-size:28px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
details summary{cursor:pointer;color:var(--soft);font-size:13px}
.def{white-space:pre-wrap;font-size:13px;color:var(--soft);max-height:220px;overflow:auto;margin-top:6px}
.xlist{display:flex;flex-direction:column;gap:2px}
.xi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 8px;border-radius:8px}
.xi:hover{background:var(--hover2)}
.xi .ref{justify-self:start;text-align:left}
.xi .t{grid-column:1 / 3;font-family:var(--f-text);font-size:15px;color:var(--soft);line-height:1.45}
.xi .v{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.xi .ex{grid-column:1 / 3;font-size:13px;color:var(--text);background:color-mix(in srgb,var(--sky) 6%,var(--bg));border:1px solid color-mix(in srgb,var(--sky) 22%,var(--bg));border-radius:8px;padding:8px 10px;margin-top:4px}
.nlist{display:flex;flex-direction:column;gap:8px}
.ncard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:5px;width:100%}
.ncard:hover{border-color:var(--line2);background:var(--hover)}
.ncard .tt{font-weight:700;font-size:14px;line-height:1.35}
.ncard .ss{font-size:13px;color:var(--soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard .mm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- chavruta ---------- */
.chv{border:1px solid color-mix(in srgb,var(--cyan) 30%,var(--bg));background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 6%,var(--bg)),color-mix(in srgb,var(--cyan) 3%,var(--bg)));border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.chv textarea{background:var(--bg);border:1px solid color-mix(in srgb,var(--cyan) 30%,var(--bg));border-radius:8px;padding:8px 10px;min-height:64px;resize:vertical;width:100%}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px solid color-mix(in srgb,var(--cyan) 32%,var(--bg));background:none;border-radius:999px;font-size:12px;padding:3px 10px;color:color-mix(in srgb,var(--cyan) 62%,var(--text))}
.ans{font-size:14.5px;line-height:1.6;color:var(--text)}
.ans p{margin:0 0 8px}
.ans ul{margin:0 0 8px;padding-left:20px}
.ans .think{color:var(--muted);font-style:italic}

/* ---------- arcs ---------- */
.arc-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#03070E;overflow:hidden}
#arcCanvas{display:block;width:100%;touch-action:manipulation;cursor:crosshair}
.arc-tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-130%)}
.ctrls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0}
.ctrls label{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px}
.ctrls input[type=range]{width:170px;accent-color:var(--sky)}
.arc-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.toplinks{display:flex;flex-direction:column;gap:4px}
.tl{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:4px 6px;border-radius:6px}
.tl:hover{background:var(--hover2)}
.tl .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--sky),var(--cyan))}

/* ---------- brain ---------- */
.br-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.br-bar input[type=search]{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 200px}
.fchip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--soft)}
.fchip[aria-pressed="false"]{opacity:.45}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.graph-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(ellipse at 50% 40%,#0b1a2c,#04080F 70%);height:min(62vh,620px);min-height:360px;overflow:hidden}
#brainCanvas{display:block;width:100%;height:100%;touch-action:none}
.graph-hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* ---------- lupa / mesa ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.sim .row{display:grid;grid-template-columns:150px minmax(0,1fr) 76px;gap:10px;align-items:center;margin:8px 0}
.sim .row label{font-size:13px;color:var(--soft)}
.sim input[type=range]{width:100%;accent-color:var(--gold)}
.sim output{font-family:var(--f-mono);font-size:13px;text-align:right}
.radios{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.radios label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;cursor:pointer}
.radios input{accent-color:var(--gold);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--gold);font-weight:500;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.premissas{font-size:13px;color:var(--soft);margin:0;padding-left:18px}
.premissas li{margin:3px 0}
.jcard{border:1px solid color-mix(in srgb,var(--orange) 35%,var(--bg));background:linear-gradient(180deg,color-mix(in srgb,var(--orange) 8%,var(--bg)),var(--panel));border-radius:12px;padding:12px 14px}
.jhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.jdot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.jcard .stat b{color:var(--orange)}
.jcard .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.geo-chip{cursor:pointer;color:color-mix(in srgb,var(--orange) 60%,var(--text));border-color:color-mix(in srgb,var(--orange) 35%,var(--bg))}
.geo-chip:hover{border-color:var(--orange)}
.note{font-size:13px;color:var(--soft);border-left:2px solid var(--line2);padding-left:10px}
.conv{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conv input,.conv select{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
.conv input{width:100px}
.convout{font-family:var(--f-mono);font-size:22px;color:var(--gold);margin:10px 0 4px}
.flow{display:flex;flex-direction:column;gap:10px}
.fl{border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.fl .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fl.q{border-color:color-mix(in srgb,var(--sky) 30%,var(--bg))}
.fl.a{border-color:color-mix(in srgb,var(--purple) 35%,var(--bg));background:color-mix(in srgb,var(--purple) 7%,var(--bg))}
.fl.a .who{color:var(--purple)}
.fl.obj{border-style:dashed;border-color:color-mix(in srgb,var(--purple) 55%,var(--bg))}
.flow .arrow{color:var(--muted);text-align:center;font-size:12px}
.flowpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.parlist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.parlist .pi{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.lic{font-size:12.5px;color:var(--soft);line-height:1.55}
.lic li{margin:4px 0}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0009;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- brain orb (HUD) ---------- */
.orb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--navh));z-index:40;width:64px;height:64px;border:0;background:none;padding:0;filter:drop-shadow(0 0 10px #22d3ee70)}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.orb .spin2{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite reverse}
.orb span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:#E9FDFF;text-shadow:0 0 6px #3be3f0}
.orb .orb-tot{inset:auto;left:50%;bottom:-7px;transform:translateX(-50%);display:block;white-space:nowrap;font-size:9px;font-weight:500;letter-spacing:.02em;line-height:1;padding:2px 6px;border-radius:99px;background:#020b13e6;border:1px solid #3be3f055;color:#9eeaf2;text-shadow:none}
.orb .orb-tot:empty{display:none}
.view-in{flex:1 0 auto;min-width:0}
.app-foot{flex:none;max-width:1180px;width:100%;margin:56px auto 0;padding:22px 4px 8px;border-top:1px solid var(--line);color:var(--soft);font-size:12.5px;line-height:1.55;text-align:center}
.app-foot p{margin:4px 0}.app-foot a{color:var(--gold);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}.app-foot a:hover{border-bottom-color:var(--gold)}
.app-foot .af-l{font-family:var(--f-text);font-size:15px;color:var(--text);margin-bottom:4px}.app-foot .af-l .he{color:var(--gold);font-size:13px}.app-foot .af-s{font-size:11.5px;opacity:.8;max-width:560px;margin-inline:auto}
.orb.pulse::before{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid var(--cyan);animation:ping 1.2s ease-out 2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.orb .spin,.orb .spin2,.orb.pulse::before{animation:none}}

/* ---------- thumbnails + full screen ---------- */
.thumb{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);background:#03070E;overflow:hidden;position:relative;cursor:zoom-in;text-align:left}
.thumb canvas{display:block}
.thumb-cta{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:#06111fd9;border:1px solid #2a4166;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#CFE9FF}
.thumb:hover .thumb-cta,.thumb:focus-visible .thumb-cta{border-color:var(--sky)}
.fs{position:fixed;inset:0;z-index:70;background:#02050A;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fs-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.fs-top strong{font-size:15px;font-family:var(--f-mono);letter-spacing:.04em;color:#CFF7FB}
.fs-tools{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-block:0 10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.fs-tools::-webkit-scrollbar{display:none}
.fs-tools.tw{flex-wrap:wrap;overflow-x:visible}
@media (max-width:600px){.fs-tools.tw .fs-search{min-width:100px;flex:1 1 100px}.fs-tools.tw .fs-sel{max-width:132px}}
.fs-main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
.fs-stage{position:relative;min-height:0;min-width:0;overflow:hidden}
.fs-sheet{width:390px;border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;position:relative}
.fs-sheet-body{padding:6px 16px 20px;display:flex;flex-direction:column;gap:6px}
.fs-sheet-x{position:sticky;top:8px;float:right;margin:8px 10px 0 0;z-index:2}
.arc-fs,.hud-fs{position:absolute;inset:0;touch-action:none}
.arc-fs{overflow:hidden;background:#03070E}
.arc-load{display:none;position:absolute;z-index:2;left:50%;top:14px;transform:translateX(-50%);align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#06111fd9;border:1px solid #2a4166;color:#CFE9FF;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.loading>.arc-load{display:inline-flex}
.arc-load i{width:11px;height:11px;border:2px solid #3BE3F0;border-right-color:transparent;border-radius:50%;animation:invSpin .8s linear infinite}
.arc-fs canvas,.hud-fs canvas{display:block;touch-action:none}
.fs-hint{animation:hintfade .8s ease 6s forwards;position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--soft);pointer-events:none;background:#02050Acc;border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.fs-pill{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--soft)}
.fs-pill[aria-pressed="true"]{color:var(--text);background:var(--raised);border-color:var(--sky)}
.fs-sel{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:13px;max-width:170px}
.fs-range{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);white-space:nowrap}
.fs-search{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;min-width:150px;flex:1 1 180px;max-width:320px}
.fs .iconbtn{font-size:18px;line-height:1;color:var(--text)}
.hud-legend{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--soft);background:#02050Acc;border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:none}
.hud-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.hud-legend i.ring{width:9px;height:9px;border:1.5px solid var(--cyan);border-radius:50%;background:none}
.hud-grid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.hud-thumb{background:#02050A;border-color:#123b48}
.hud-widgets{display:flex;flex-direction:column;gap:12px;min-width:0}
.hud-card{position:relative;border:1px solid #123b48;background:linear-gradient(180deg,#061521,#040c15);border-radius:var(--r);padding:12px 14px}
.hud-card::before{content:"";position:absolute;inset:-1px;border-radius:var(--r);pointer-events:none;opacity:.85;
  background:linear-gradient(var(--cyan),var(--cyan)) top left/16px 1.5px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/1.5px 16px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom right/16px 1.5px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/1.5px 16px no-repeat}
.hud-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7fdbe6;margin-bottom:8px}
.hud-bars{display:flex;flex-direction:column;gap:2px}
.hud-bar{display:grid;grid-template-columns:118px minmax(0,1fr) 38px;gap:10px;align-items:center;background:none;border:0;padding:5px 4px;border-radius:6px;text-align:left;color:var(--soft);font-size:13px}
.hud-bar:hover{background:#0a1d2b}
.hud-bar[aria-pressed="false"]{opacity:.38}
.hb-l{display:flex;align-items:center;gap:8px}
.hb-l .dot{width:8px;height:8px;border-radius:50%;flex:none}
.hb-t{height:5px;background:#0d2230;border-radius:3px;overflow:hidden}
.hb-t span{display:block;height:100%;border-radius:3px}
.hb-n{text-align:right;color:var(--text);font-size:12px}
.hud-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hud-stat{background:#030b13;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.hud-stat b{font-size:20px;font-weight:500}
.hud-stat span{font-size:11.5px;color:var(--muted)}
.hud-stat[aria-pressed="true"]{border-color:currentColor}
@media (max-width:900px){
  .fs-main{grid-template-columns:minmax(0,1fr)}
  .fs-sheet{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:55%;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px #000c;z-index:3}
  .hud-grid{grid-template-columns:minmax(0,1fr)}
  .hud-bar{grid-template-columns:110px minmax(0,1fr) 34px}
}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .stage.with-panel{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:86%;z-index:45;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px #000a;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel-head{border-radius:16px 16px 0 0}
  .scrim.on{display:block;position:fixed;inset:0;background:#0008;z-index:44}
  .grid2,.arc-info{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  :root{--navh:62px}
  .top{gap:10px;padding-block:8px}
  .brand b{font-size:17px}
  .search{order:3;flex-basis:100%;max-width:none}
  .cal{margin-left:auto;padding:5px 10px;font-size:12px}
  .cal .pa{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--nav)}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:4px 6px}
  .view{padding-block:16px calc(130px + env(safe-area-inset-bottom,0px))}
  .vt{font-size:17.5px}
  .vr{grid-template-columns:26px minmax(0,1fr) auto;padding:8px 4px;column-gap:8px}
  .orig.he{font-size:21px}
  .rd-title .h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sim .row{grid-template-columns:minmax(0,1fr) 70px}
  .sim .row label{grid-column:1 / 3}
  .flowpair,.row2{grid-template-columns:minmax(0,1fr)}
  .graph-wrap{height:56vh}
}

/* ================= v3 · header, temas, início, Binah ================= */
.brand i{display:flex;align-items:baseline;gap:6px;font-family:var(--f-ui);font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;line-height:1.25}
.brand i .heb{font-family:var(--f-heb);font-size:13px;color:var(--soft)}
.cal{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;text-align:left;line-height:1.25;border-radius:14px;padding:5px 12px}
.cal .hd{grid-row:1;grid-column:1}
.cal .ptd{grid-row:2;grid-column:1;font-size:11px;color:var(--muted);white-space:nowrap}
.cal .pa{grid-row:1 / 3;grid-column:2;color:var(--soft);font-size:12.5px;white-space:nowrap}
.cal .pa small{display:block;color:var(--muted);font-size:11px}
.cal .ptd .sh{display:none}
.tema-wrap{position:relative;flex:none}
.temabtn{border-radius:50%;width:36px;height:36px}
.tema-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:65;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:210px;box-shadow:0 18px 50px #0009}
.cores{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cores .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sw{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:10px;padding:5px 8px;text-align:left;font-size:13.5px;color:var(--text)}
.sw:hover{background:var(--hover)}
.sw i{width:26px;height:26px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line2)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--sky)}
.sw.only{padding:3px;border-radius:50%}

/* títulos das abas com brilho passando */
.h1{background:linear-gradient(100deg,var(--text) 0%,var(--text) 42%,var(--head-b) 50%,var(--text) 58%,var(--text) 100%);background-size:320% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen2 10s ease-in-out infinite}
@keyframes sheen2{0%,55%{background-position:100% 0}100%{background-position:0% 0}}

/* entrada dos blocos (sempre visíveis em repouso) */
.rv-in{animation:rvIn .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rvIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}

/* ---------- Início ---------- */
.portal{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-top:6px}
.hero-copy{min-width:0;display:flex;flex-direction:column;gap:16px}
.badge-row{display:flex;align-items:center;gap:12px}
.logo-badge{color:var(--text);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,var(--raised),var(--bg));border:1.5px solid color-mix(in srgb,var(--gold) 60%,transparent);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 9%,transparent),0 0 30px color-mix(in srgb,var(--gold) 35%,transparent)}
.badge-name{font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.badge-sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.badge-sub .heb{font-family:var(--f-heb);font-size:14px;color:var(--soft)}
.mega{margin:0;display:flex;flex-direction:column;gap:2px}
.mega .ln{position:relative;display:flex;align-items:baseline;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:max-content;max-width:100%}
.mega .w{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:-.012em;font-size:clamp(46px,8vw,104px);background:linear-gradient(100deg,var(--head-a) 0%,var(--head-b) 30%,var(--head-c) 50%,var(--head-b) 70%,var(--head-a) 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s ease-in-out infinite;animation-delay:calc(var(--i) * -1.4s);filter:drop-shadow(0 0 22px color-mix(in srgb,var(--glow) 22%,transparent))}

.mega .ln:hover .cap,.mega .ln:focus-visible .cap{opacity:1;transform:none}
@keyframes sheen{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.lede-big{font-family:var(--f-text);font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:var(--soft);max-width:52ch;margin:0}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{padding:11px 18px;font-size:14.5px;border-radius:12px}
.btn.glow{border-color:color-mix(in srgb,var(--cyan) 55%,transparent);background:color-mix(in srgb,var(--cyan) 12%,var(--panel));box-shadow:0 0 26px color-mix(in srgb,var(--cyan) 22%,transparent)}

.cover3d{perspective:1100px;min-width:0}

@keyframes floaty{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-10px) rotate(.5deg)}}
.cover-face{position:relative;aspect-ratio:5/4.2;width:100%;border-radius:24px;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 50% 38%,var(--cover-a),var(--cover-b) 78%);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);box-shadow:0 34px 70px -24px #000d,0 0 70px -12px color-mix(in srgb,var(--glow) 45%,transparent);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out}
.cover-face canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover-face .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,28%) var(--gy,18%),#ffffff26,transparent 46%)}
.cover-top{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.cover-hello{position:absolute;left:18px;right:18px;top:54px;pointer-events:none;animation:rvIn .7s ease-out both}
.cover-hi{font-family:var(--f-text);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.12;color:#FFFFFF;text-shadow:0 2px 18px #000c,0 0 24px color-mix(in srgb,var(--glow) 45%,transparent)}
.cover-hi .caret{display:inline-block;width:2px;height:.9em;margin-left:3px;vertical-align:-.08em;background:var(--glow);animation:blink 1s steps(1) infinite}

.cover-chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#F7E7B4;background:#02050Aa8;border:1px solid #f2b6484d;border-radius:999px;padding:4px 10px}
.cover-copy{position:absolute;left:0;right:0;bottom:0;padding:22px 20px 18px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(0deg,#02050Ad9,#02050A00);pointer-events:none}
.cover-he{font-family:var(--f-heb);font-size:clamp(38px,5.4vw,60px);line-height:1.05;color:#F7E7B4;text-shadow:0 0 22px #f2b64899}
.cover-pt{color:#E8EEF7;font-weight:700;font-size:16px}
.cover-meta{color:#B6C3D8;font-size:12.5px;font-family:var(--f-mono)}
.cover-go{pointer-events:auto;align-self:flex-start;margin-top:8px;border:1px solid #f2b64880;background:#02050Acc;color:#F7E7B4;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.cover-go:hover{background:#1a1406}
.cover-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12.5px;font-weight:600;color:#E8EEF7;background:#02050Ab3;border:1px solid #ffffff22;border-radius:999px;padding:7px 14px;pointer-events:none;white-space:nowrap;animation:hintfade .8s ease 5s forwards}

.brief{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:start;border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:18px;padding:18px 20px;background:linear-gradient(160deg,#061826,#03090f 70%);color:var(--text)}
.brief::before{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;background:linear-gradient(var(--cyan),var(--cyan)) top left/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/2px 18px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/18px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 18px no-repeat;opacity:.8}
.brief-core{width:120px;height:120px;position:relative}
.brief-core canvas{width:100%;height:100%;display:block}
.brief-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fdbe6;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brief-hi{font-family:var(--f-text);font-size:clamp(20px,2.2vw,26px);font-weight:600;margin:6px 0 2px;min-height:1.3em}
.brief-hi .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.brief-date{color:var(--soft);font-size:14px;margin:0 0 12px}
.brief-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bi{border:1px solid var(--line);background:#02060bcc;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bi .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bi .v{font-size:14.5px;font-weight:600}
.bi .s{font-size:13px;color:var(--soft)}
.bi .he{font-family:var(--f-heb);color:var(--gold)}
.bi .q{font-family:var(--f-text);font-size:14px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bi .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.brief-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.pstat b{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.4vw,42px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.pstat span{font-size:13px;color:var(--muted)}

.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq 80s linear infinite}
.mq-track.rev{animation-direction:reverse;animation-duration:95s}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-item{display:inline-flex;align-items:baseline;gap:8px;padding-inline:16px;white-space:nowrap}
.mq-item .o{font-family:var(--f-heb);font-size:25px;color:var(--gold)}
.mq-item .o.gk{font-family:var(--f-grk);font-size:21px;color:var(--sky)}
.mq-item .tr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mq-item .pt{font-size:14.5px;color:var(--soft)}
.mq-item .st{color:var(--gold);opacity:.55;padding-left:10px}
@keyframes mq{to{transform:translateX(-50%)}}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.6vw,32px)}
.sec-head span{font-size:13px;color:var(--muted)}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px max(16px,calc(50% - 150px));perspective:1000px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.car::-webkit-scrollbar{display:none}
.car-card{flex:0 0 min(300px,76vw);scroll-snap-align:center;text-align:left;border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 12%,var(--panel)),var(--panel) 55%);display:flex;flex-direction:column;gap:8px;min-height:190px;transform:rotateY(calc(var(--d,0) * -24deg)) scale(calc(1 - var(--ad,0) * .1));opacity:calc(1 - var(--ad,0) * .3);transition:transform .12s linear,opacity .12s linear,border-color .2s}
.car-card:hover{border-color:color-mix(in srgb,var(--tc) 60%,var(--line))}
.car-card .tt{font-family:var(--f-text);font-size:18px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.car-card .ss{font-size:13px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.car-card .mm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mod{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(165deg,var(--panel),var(--bg2));border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mod:hover{border-color:color-mix(in srgb,var(--mc) 60%,var(--line))}
.mod .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc);box-shadow:0 0 22px color-mix(in srgb,var(--mc) 18%,transparent)}
.mod h3{margin:4px 0 0;font-family:var(--f-display);font-size:22px;font-weight:700}
.mod p{margin:0;color:var(--soft);font-size:13.5px}
.mod .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}

/* ---------- Binah: conversa ---------- */
.binah{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}
.binah-hud{position:relative;min-height:0;min-width:0;overflow:hidden}
.binah-hud canvas{display:block}
.binah-state{position:absolute;left:14px;top:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--cyan);display:flex;align-items:center;gap:8px;pointer-events:none}
.binah-state i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:blink 1.4s steps(2) infinite}
.binah-state.m-listening{color:#5EF2B0}.binah-state.m-thinking{color:var(--gold)}.binah-state.m-speaking{color:#FFB25E}
.binah-log{position:absolute;left:14px;top:38px;display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:11.5px;color:var(--soft);max-width:min(64%,440px);pointer-events:none}
.binah-log div{animation:logIn .35s ease-out both;text-shadow:0 0 8px #000}
.binah-log div.old{opacity:.45}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.binah-sub{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:min(90%,620px);text-align:center;font-size:15px;line-height:1.45;color:var(--text);background:#02050Ad0;border:1px solid var(--line);border-radius:12px;padding:8px 14px;pointer-events:none}
.binah-chat{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
.bc-list{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.bm{max-width:94%;border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.bm.u{align-self:flex-end;background:color-mix(in srgb,var(--royal) 45%,var(--panel));border:1px solid color-mix(in srgb,var(--royal) 70%,transparent)}
.bm.a{align-self:flex-start;background:var(--panel);border:1px solid color-mix(in srgb,var(--cyan) 26%,var(--line))}
.bm.a .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:#7fdbe6;margin-bottom:4px}
.bm.tip{align-self:stretch;max-width:none;background:color-mix(in srgb,var(--gold) 8%,var(--panel));border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px;color:var(--soft)}
.bm .ans p{margin:0 0 8px}.bm .ans p:last-child{margin:0}
.bm .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bm .acts .btn{padding:4px 9px;font-size:12px}
.bc-sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.bc-comp{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:end}
.bc-comp textarea{resize:none;min-height:44px;max-height:120px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4;width:100%}
.mic{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--cyan) 50%,transparent);background:color-mix(in srgb,var(--cyan) 12%,transparent);color:var(--cyan);display:grid;place-items:center}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--royal);color:var(--on-primary);display:grid;place-items:center}
.send[disabled]{opacity:.5}

/* orbe vivo */
.orb .breath{transform-box:fill-box;transform-origin:center;animation:breathe 3.4s ease-in-out infinite}
.orb .sat{transform-box:view-box;transform-origin:32px 32px;animation:spin 5s linear infinite}
.orb .sat.s2{animation-duration:8s;animation-direction:reverse}
.orb .sat.s3{animation-duration:3.2s}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.92)}50%{opacity:1;transform:scale(1.07)}}
.orb.m-thinking .spin{animation-duration:2.6s}.orb.m-thinking .spin2{animation-duration:1.6s}.orb.m-thinking .sat{animation-duration:1.4s}
.orb.m-speaking svg{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.07)}}
.orb.m-listening::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #5EF2B0;animation:ping 1.3s ease-out infinite}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);gap:22px}
  .cover3d{order:-1}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .binah{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,42%) minmax(0,58%)}
  .binah-chat{border-left:0;border-top:1px solid var(--line2)}
  .binah-log{max-width:80%}
}
@media (max-width:720px){
  .cal{padding:4px 10px}
  .cal .pa{display:none}
  .cal .ptd .lg{display:none}.cal .ptd .sh{display:inline}
  .cover-top .cover-chip:last-child{display:none}
  .binah-log{font-size:10.5px;top:34px}.binah-log div.old:nth-last-child(n+4){display:none}
  .brief{grid-template-columns:minmax(0,1fr);padding:16px}
  .brief-core{width:96px;height:96px;position:absolute;right:10px;top:10px}
  .brief-h{padding-right:96px}
  .brief-hi{padding-right:96px}
  .brief-items{grid-template-columns:minmax(0,1fr)}
  .mods{grid-template-columns:minmax(0,1fr)}
  .mega .cap{display:none}
  .tab{padding:4px 2px}
}
@media (max-width:430px){.tema-wrap{display:none}.brand i{font-size:11px}}
@media (prefers-reduced-motion:reduce){
  .h1,.mega .w,.cover-float,.mq-track,.rv-in,.orb .breath,.orb .sat,.orb.m-speaking svg,.orb.m-listening::after,.brief-hi .caret{animation:none!important}
  .tilt,.cover-face,.car-card{transition:none}
}

/* ---------- v4 · cérebro neural ---------- */
.neuro{position:fixed;inset:0;z-index:80;color:#E8EEF7}
.nr-scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#03101ccc,#02050Af0 70%);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .5s ease}
.neuro.on .nr-scrim{opacity:1}
.nr-stage{position:absolute;border-radius:50%;transition:clip-path .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 120px -20px #22d3ee66}
.nr-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;border-radius:50%}
.nr-state{left:50%;top:10%;transform:translateX(-50%)}
.nr-log{left:50%;top:calc(10% + 22px);transform:translateX(-50%);align-items:center;text-align:center;max-width:70%}
.nr-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#06111fd9;border-color:#2a4166;color:#E8EEF7;opacity:0;transition:opacity .4s .2s}
.nr-voz{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));border:1px solid #2a4166;background:#06111fd9;color:#CFE9FF;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .4s .2s}
.nr-voz[aria-pressed="true"]{border-color:#3BE3F0;color:#E9FDFF}
.neuro.on .nr-x,.neuro.on .nr-voz{opacity:1}
.nr-bar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;transition:transform .5s .15s cubic-bezier(.2,.8,.2,1),opacity .4s .15s;width:min(660px,calc(100% - 24px));display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center;background:#06111ff0;border:1px solid #1d4d57;border-radius:999px;padding:6px;box-shadow:0 0 40px -10px #22d3ee55}
.neuro.on .nr-bar{transform:translate(-50%,0);opacity:1}
.nr-bar input{background:none;border:0;outline:none;color:#E8EEF7;font-size:15.5px;padding:9px 6px;min-width:0}
.nr-bar input::placeholder{color:#7F90AB}
.nr-ib{width:40px;height:40px;border-radius:50%;border:1px solid #1d4d57;background:#0a1d2b;color:#7FDBE6;display:grid;place-items:center}
.nr-go{width:42px;height:42px;border-radius:50%;border:0;background:#1B4F8C;color:#fff;display:grid;place-items:center}
.nr-sub,.nr-card{position:absolute;left:12px;right:12px;margin-inline:auto;max-width:660px;top:var(--below);bottom:calc(76px + env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:thin}
.neuro.side .nr-card,.neuro.side .nr-sub.ans{left:var(--px);right:auto;width:var(--pw);max-width:none;margin:0;top:var(--py);bottom:auto;max-height:var(--ph)}
.nr-sub{text-align:center;font-size:15px;line-height:1.5;color:#E8EEF7;padding:4px 8px;text-shadow:0 1px 8px #000}
.nr-sub.tip{color:#B6C3D8;font-size:13.5px}
.nr-sub.ans{text-align:left;background:#04101bcc;border:1px solid #123b48;border-radius:14px;padding:10px 14px;bottom:auto;max-height:calc(100% - var(--below) - 86px)}
.nr-stage .binah-state{z-index:2}
.nr-sub p{margin:0 0 6px}
.nr-card{bottom:auto;max-height:calc(100% - var(--below) - 86px);background:#04101bf2;border:1px solid #1d4d57;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px #000a;animation:rvIn .35s ease-out both}
.nr-card-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nr-card-t{font-family:var(--f-text);font-size:19px;font-weight:600;line-height:1.3}
.nr-card-s{margin:0;color:#B6C3D8;font-size:13.5px}
.nr-refs{display:flex;flex-wrap:wrap;gap:6px 12px}
.nr-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.nr-hist{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:#06111f;border-left:1px solid #1d4d57;display:flex;flex-direction:column;z-index:3;animation:rvIn .3s ease-out both}
.nr-hist-h{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid #123b48}

    function show(v, arg) { say(''); body.innerHTML = ''; el.classList.toggle('intro', v === 'carregando'); const [node, focus] = views[v](arg); body.append(node); const bt = node.querySelector?.('.et-btn'); if (bt) bt.after(msg); else body.after(msg); el.hidden = false; document.documentElement.classList.add('et-locked'); if (focus) setTimeout(() => focus.focus(), 60); anim(); }

    // fundo: neurônios devagar
    let raf = 0;

    const mount = () => document.body.append(el);

    show('carregando'); intro_.etapa(3, 30, 'Conferindo sua conta…');
    return { show, hide, say, intro: intro_, get emIntro() { return el.classList.contains('intro') && !el.hidden; } };
  })();
  ET.gate = gate;

  async function entrou(session) {
    if (ET.uid) return;
    if (!gate.emIntro) { gate.intro.reinicia(30); gate.show('carregando'); }
    gate.intro.etapa(34, 58, 'Abrindo o seu cérebro…');
    const u = session.user; ET.uid = u.id; ET.email = u.email || '';
    const md = u.user_metadata || {};
    ET.nome = String(md.nome || md.name || md.full_name || '').trim().split(/\s+/)[0] || cap((ET.email.split('@')[0].match(/[A-Za-zÀ-ú]+/) || [''])[0]) || 'você';
    try { const { data } = await sb.rpc('et_assumir_biblioteca'); ET.admin = !!data?.admin; } catch { ET.admin = false; }
    try { const { data } = await sb.rpc('et_meu_uso'); if (data) { ET.usados = data.usados || 0; ET.limite = data.limite || null; } } catch {}
    gate.intro.etapa(58, 88, 'Trazendo as suas anotações…');
    resolveReady(session); ET.contaUI();
    // a abertura fecha quando o cérebro termina de carregar (ou depois de alguns segundos, para nunca prender)
    ET.introFim = () => gate.intro.fim(() => gate.hide(), 'Tudo pronto. Shalom, ' + ET.nome + '!');
    setTimeout(ET.introFim, 9000);
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { gate.show('nova'); return; }
    if (ev === 'SIGNED_OUT') { setTimeout(() => location.replace(ET.app), 50); return; }
    if (session && !ET.uid && !RECUP && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) entrou(session);
  });
  ET.inicio = sb.auth.getSession().then(({ data }) => {
    if (RECUP) gate.show('nova');
    else if (data.session) entrou(data.session);
    else gate.intro.fim(() => gate.show('entrar'), 'Bem-vindo!');
  }).catch(() => gate.intro.fim(() => gate.show('entrar')));
  ET.sair = async () => { try { await sb.auth.signOut(); } catch {} location.replace(ET.app); };

  /* ---------------- cérebro no Supabase (mesma interface do db do Claude) ---------------- */
  const DB = (() => {
    let rows = new Map(); const L = { nos: [], privado: [] };
    const meu = r => r.user_id === ET.uid || (r.base && ET.admin);
    const colOf = r => (meu(r) && r.status === 'rascunho') ? 'privado' : 'nos';
    const snap = c => ({ docs: [...rows.values()].filter(r => colOf(r) === c).map(r => ({ id: r.id, exists: true, metadata: {}, data: () => meu(r) ? r.dados : { ...r.dados, _lib: true } })) });
    const fire = () => { for (const c of ['nos', 'privado']) L[c].forEach(cb => { try { cb(snap(c)); } catch (e) { console.warn(e); } }); };
    async function carregar() {
      const out = [];
      for (let i = 0; ; i += 1000) {
        const { data, error } = await sb.from('et_nos').select('id,user_id,status,dados').order('criado', { ascending: true }).range(i, i + 999);
        if (error) throw error;
        out.push(...data); if (data.length < 1000) break;
      }
      ET.gate?.intro.etapa(76, 94, 'Preparando as 344 mil ligações…');
      const m = new Map();
      try {
        const bj = await fetch('data/base.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null);
        for (const n of (bj?.nos || [])) { const { id, ...d } = n; if (id) m.set(id, { id, user_id: 'base', base: true, status: d.status || 'rascunho', dados: d }); }
      } catch {}
      for (const r of out) { const cur = m.get(r.id); if (cur && !cur.base && cur.user_id === ET.uid) continue; m.set(r.id, r); }
      rows = m;
    }
    let carregado = null;
    const pronto = () => carregado || (carregado = ET.ready.then(carregar).finally(() => setTimeout(() => ET.introFim?.(), 120)));
    const limpa = d => { const o = {}; for (const [k, v] of Object.entries(d || {})) if (!k.startsWith('_') && k !== 'id') o[k] = v; return o; };
    const novoId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    async function gravar(id, d) {
      const dados = limpa(d);
      const row = { id, user_id: ET.uid, status: dados.status || 'rascunho', tipo: dados.tipo || null, dados };
      const { error } = await sb.from('et_nos').upsert(row, { onConflict: 'user_id,id' });
      if (error) throw { code: 'db', message: error.message };
      rows.set(id, row); fire();
    }
    async function apagar(c, id) {
      const cur = rows.get(id); if (!cur || !meu(cur) || colOf(cur) !== c) return;
      if (cur.base) { rows.delete(id); fire(); return; }
      const { error } = await sb.from('et_nos').delete().eq('user_id', ET.uid).eq('id', id);
      if (error) throw { code: 'db', message: error.message };
      rows.delete(id); fire();
    }
    const ref = (c, id) => ({
      set: d => gravar(id, d),
      update: async d => { const cur = rows.get(id); if (!cur || !meu(cur)) throw { code: 'not_found' }; return gravar(id, { ...cur.dados, ...limpa(d) }); },
      delete: () => apagar(c, id),

    });

      collection: c => ({
        limit: () => ({ onSnapshot(cb, err) { L[c] = L[c] || []; L[c].push(cb); pronto().then(() => cb(snap(c))).catch(e => err?.(e)); return () => { L[c] = L[c].filter(x => x !== cb); }; } }),
        doc: id => ref(c, id || novoId()),
        add: async d => { const id = novoId(); await gravar(id, d); return { id }; },
      }),
      doc: p => { const [c, id] = String(p).split('/'); return ref(c, id); },
      async recarregar() { await carregar(); fire(); },
      meus: () => [...rows.values()].filter(r => r.user_id === ET.uid),
      async importar(lista) {
        const prontos = lista.filter(n => n && n.id).map(n => { const dados = limpa(n); return { id: String(n.id), user_id: ET.uid, status: dados.status || 'rascunho', tipo: dados.tipo || null, dados }; });
        for (let i = 0; i < prontos.length; i += 100) {
          const { error } = await sb.from('et_nos').upsert(prontos.slice(i, i + 100), { onConflict: 'user_id,id' });
          if (error) throw error;
        }
        await this.recarregar(); return prontos.length;
      },
    };
    return api;
  })();
  ET.db = DB;

  /* ---------------- Claude pela função et-claude ---------------- */
  const FN = ET.url + '/functions/v1/et-claude';
  // A resposta chega aos poucos (linhas JSON) com sinal de vida: respostas longas não caem no celular.
  // Se a conexão cair mesmo assim (tela apagou, app em segundo plano, internet oscilou), tenta de novo sozinho.
  const REDE = () => ({ code: 'rede', et: true, message: 'A conexão com a IA caiu (a tela apagou, o app foi para segundo plano ou a internet oscilou). Tente de novo.' });
  const espera = ms => new Promise(r => setTimeout(r, ms));
  const quandoVisivel = () => !document.hidden ? null : new Promise(r => {
    const f = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', f); r(); } };
    document.addEventListener('visibilitychange', f); setTimeout(() => { document.removeEventListener('visibilitychange', f); r(); }, 120000);
  });
  const anota = j => { if (j && j.usados != null) { ET.usados = j.usados; ET.limite = j.limite; ET.contaUI(); } };
  async function chamarUma(body, signal, onTexto) {
    const { data } = await sb.auth.getSession();
    const tok = data.session?.access_token;
    if (!tok) throw { code: 'sessao', et: true, message: 'Sua sessão expirou. Entre de novo.' };
    let r;
    try { r = await fetch(FN, { method: 'POST', signal, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok, apikey: ET.key }, body: JSON.stringify({ ...body, stream: true }) }); }
    catch (e) { if (e?.name === 'AbortError' || signal?.aborted) throw { code: 'cancelled' }; throw REDE(); }
    const ct = r.headers.get('content-type') || '';
    if (!r.ok || !ct.includes('ndjson') || !r.body) {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 429 ? 'rate_limited' : (j.code || 'erro'), et: true, message: j.error || 'A IA não respondeu agora. Tente de novo.' };
      anota(j); return j;
    }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', txt = '', fim = null;
    try {
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const ln = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!ln) continue;

          if (o.t) { txt += o.t; try { onTexto?.(txt); } catch {} }

          else if (o.erro) throw { code: o.code || 'erro', et: true, message: o.erro, srv: true };
        }
      }

    if (!fim) throw REDE();
    anota(fim); return fim;
  }
  async function chamar(body, signal, onTexto) {
    for (let tent = 0; ; tent++) {
      try { return await chamarUma(body, signal, onTexto); }
      catch (e) {
        if (!(e?.code === 'rede' || e?.code === 'ocupada') || tent >= 2 || signal?.aborted) throw e;
        const v = quandoVisivel(); if (v) await v;
        await espera(tent ? 4000 : 1500);
        if (signal?.aborted) throw { code: 'cancelled' };
      }
    }
  }
  const normMsgs = input => typeof input === 'string' ? [{ role: 'user', content: input }]
    : (input || []).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
  async function sample(input, opts = {}) {
    const msgs = normMsgs(input);
    const tools = Array.isArray(opts.tools) ? opts.tools : [];
    const apiTools = tools.map(t => ({ name: t.name, description: t.description || '', input_schema: t.inputSchema || t.input_schema || { type: 'object', properties: {} } }));
    let text = '', antes = '';
    const junta = t => opts._json ? t : (antes && t ? antes + '\n\n' + t : antes || t);
    for (let volta = 0; volta < 10; volta++) {
      if (opts.signal?.aborted) throw { code: 'cancelled' };
      const out = await chamar({ tier: opts.modelTier || 'default', system: opts.system, messages: msgs, tools: apiTools.length ? apiTools : undefined, max_tokens: opts.maxTokens || (opts._json ? 7000 : 2500) }, opts.signal, t => opts.onText?.({ text: junta(t) }));
      const content = out.content || [];
      const t = content.filter(c => c.type === 'text').map(c => c.text).join('');
      const usos = content.filter(c => c.type === 'tool_use');
      if (out.stop_reason !== 'tool_use' || !usos.length || !tools.length) { text = junta(t); break; }
      if (t.trim() && !opts._json) { antes = junta(t.trim()); opts.onText?.({ text: antes }); }
      msgs.push({ role: 'assistant', content });
      const res = [];
      for (const u of usos) {
        const tool = tools.find(x => x.name === u.name); let val, erro = false;
        try { if (!tool) throw new Error('ferramenta desconhecida'); val = await tool.execute(u.input || {}); } catch (e) { val = String(e?.message || e); erro = true; }
        let s = typeof val === 'string' ? val : JSON.stringify(val ?? null);
        if (s.length > 24000) s = s.slice(0, 24000) + '…';
        res.push({ type: 'tool_result', tool_use_id: u.id, content: s, ...(erro ? { is_error: true } : {}) });
      }
      msgs.push({ role: 'user', content: res });
    }
    opts.onText?.({ text });
    return { text, truncated: false };
  }
  sample.json = async (input, opts = {}) => {
    const sys = 'Responda somente com um único objeto JSON válido, sem nenhum texto antes ou depois e sem cercas de código.';
    const r = await sample(input, { ...opts, _json: true, system: (opts.system ? opts.system + '\n\n' : '') + sys });
    const raw = r.text || '';

  };
  sample.limits = async () => ({ tools: true, images: false });

  const USER = { isOwner: async () => true, canEdit: async () => true, can: async () => true, me: async () => ({ id: ET.uid, email: ET.email, name: ET.nome }) };
  window.claude = { use: async n => { await ET.ready; return n === 'db' ? DB : n === 'user' ? USER : n === 'sample' ? sample : null; } };

  /* ---------------- microfone de verdade ---------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  window.ESCUTA = {
    ok: !!SR, rec: null,
    stop() { try { this.rec?.stop(); } catch {} },
    toggle(btn, inp, enviar, avisar, op = {}) {

      r.onerror = e => { erro = e.error || ''; if (op.vazio) return; if (/not-allowed|service-not-allowed/.test(erro)) avisar?.('Libere o microfone para este site (no cadeado da barra de endereço) e toque de novo.'); else if (erro === 'no-speech') avisar?.('Não ouvi nada. Toque no microfone e fale de novo.'); };
      r.onend = () => { this.rec = null; btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false'); if (fala.trim()) enviar(); else op.vazio?.(/not-allowed|service-not-allowed/.test(erro) ? 'bloqueado' : 'silencio'); };
      try { r.start(); } catch { return false; }
      this.rec = r; btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
      return true;
    },
  };

  /* ---------------- conta, uso da IA, exportar e importar ---------------- */
  ET.rodape = () => {
    const p = $e('p', { class: 'af-conta' });
    if (!ET.uid) return p;
    const ia = ET.usados != null ? `IA hoje: ${ET.usados}${ET.limite ? ' de ' + ET.limite : ''}` : '';
    const link = (t, fn) => $e('a', { href: '#', text: t, onclick: e => { e.preventDefault(); fn(); } });
    p.append(...(ia ? [ia, ' · '] : []), link('Exportar meu cérebro', ET.exportar), ' · ', link('Importar', ET.importar), ' · ', link('Sair', ET.sair));
    return p;
  };
  const pintaIA = s => {
    s.innerHTML = '';
    if (!ET.uid || ET.usados == null) { s.hidden = true; return; }
    s.hidden = false;
    const u = ET.usados, L = ET.limite, pct = L ? Math.min(100, Math.round(u / L * 100)) : 0, resta = L ? Math.max(0, L - u) : null;
    s.classList.toggle('alto', pct >= 80); s.classList.toggle('fim', !!L && u >= L);
    s.title = L ? `Você usou ${u} de ${L} pedidos de IA hoje (restam ${resta}). Zera à meia-noite.` : `Pedidos de IA hoje: ${u}`;
    s.append($e('span', { class: 'et-ia-l', text: 'IA hoje' }), $e('span', { class: 'et-ia-b', 'aria-hidden': 'true' }, $e('i', { style: `width:${pct}%` })), $e('span', { class: 'et-ia-n', text: L ? `${u}/${L}` : String(u) }));
  };
  ET.medidor = (cls = '') => { const s = $e('span', { class: 'et-ia ' + cls, role: 'status' }); pintaIA(s); return s; };
  ET.contaUI = () => { document.querySelectorAll('.af-conta').forEach(x => x.replaceWith(ET.rodape())); document.querySelectorAll('.et-ia').forEach(pintaIA); };
  ET.exportar = () => {
    const nos = DB.meus().map(r => ({ id: r.id, ...r.dados }));
    const blob = new Blob([JSON.stringify({ formato: 'escola-da-tora-cerebro', versao: 1, exportado: new Date().toISOString(), nos }, null, 1)], { type: 'application/json' });
    const a = $e('a', { href: URL.createObjectURL(blob), download: 'cerebro-escola-da-tora-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  ET.importar = () => {
    const inp = $e('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    inp.onchange = async () => {
      const f = inp.files?.[0]; inp.remove(); if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        const lista = Array.isArray(j) ? j : Array.isArray(j.nos) ? j.nos : Object.entries(j).map(([id, d]) => ({ id, ...d }));
        if (!lista.length) return alert('Esse arquivo não tem notas do cérebro.');
        if (!confirm(`Importar ${lista.length} notas para o seu cérebro? Notas com o mesmo código serão atualizadas.`)) return;
        const n = await DB.importar(lista);
        alert(`Pronto: ${n} notas no seu cérebro.`);
      } catch (e) { alert('Não consegui importar: ' + (e?.message || e)); }
    };
    document.body.append(inp); inp.click();
  };
})();

<script>
(() => {
'use strict';

/* ================= utilities ================= */

}
const cache = new Map();

  return cache.get(path);
}

/* ================= state ================= */
const S = {
  meta: null, books: [], chapStart: [], chapters: [],
  tab: store.get('tab', 'leitor'),
  book: store.get('book', 0), chap: store.get('chap', 1),
  origMode: store.get('origMode', 'linha'),
  verse: null, word: null,
  brain: new Map(), byVerse: new Map(), byPair: new Map(), brainReady: false,
  db: null, user: null, sample: null, sampleTools: false, canWrite: true,
  arcs: null, arcSel: null, arcMin: store.get('arcMin', 11), arcMode: 'todos',
  brainFilter: { tipos: null, status: 'todos', q: '', view: store.get('brainView', 'grafo') },

      h('p', { class: 'muted', style: 'font-size:12.5px;margin:10px 0 0', text: 'O investigador usa o conhecimento do Claude e não navega na internet: o que vier dele aparece com o selo "a conferir". Cada investigação usa vários pedidos de IA do seu dia.' }), window.ET ? ET.medidor() : null, prog));
  }
  // biblioteca
  const lib = h('section', { style: 'margin-top:26px' }, h('div', { class: 'sec-head', style: 'margin-bottom:12px' }, h('h2', { text: 'Estudos' }), h('span', { id: 'libN', text: '' })), h('div', { id: 'libHost', class: 'es-lib' }));
  wrap.append(lib);
  wrap.append(h('section', { style: 'margin-top:30px' }, h('div', { class: 'sec-head', style: 'margin-bottom:12px' }, h('h2', { text: 'Ferramentas' }), h('span', { text: 'as calculadoras da antiga Lupa' })),
    h('div', { class: 'grid2' }, h('div', { style: 'display:flex;flex-direction:column;gap:16px' }, simSeisPassos()), h('div', { style: 'display:flex;flex-direction:column;gap:16px' }, jornadasCard(), conversor(), primeiraMencao()))));
  root.append(wrap);
  renderLib();
};
function renderLib() {
  const host = $('#libHost'); if (!host) return; host.innerHTML = '';
  const es = [...S.brain.values()].filter(n => n.tipo === 'estudo').sort((a, b) => String(b.atualizado || '').localeCompare(String(a.atualizado || '')));
  const n = $('#libN'); if (n) n.textContent = es.length ? es.length + (es.length === 1 ? ' estudo' : ' estudos') : '';
  if (!es.length) { host.append(h('div', { class: 'empty', text: !S.db ? 'Os estudos ficam no cérebro, que não abre nesta visualização.' : S.brainReady ? (S.isOwner === false ? 'Nenhum estudo compartilhado ainda.' : 'Nenhum estudo ainda. Investigue uma passagem acima.') : 'Carregando os estudos…' })); return; }
  es.forEach(E => {
    const kids = estudoChildren(E.id).length;
    host.append(h('button', { class: 'es-card', onclick: () => openEstudo(E.id) },
      h('span', { class: 'es-card-ref mono', text: E.passagem?.rotulo || '' }),
      h('span', { class: 'es-card-t', text: E.titulo || '' }),
      E.subtitulo ? h('span', { class: 'es-card-s', text: E.subtitulo }) : null,
      h('span', { class: 'es-card-m' }, h('span', { class: 'chip st-' + E.status, text: E.status }), h('span', { class: 'muted', text: (E.secoes || []).length + ' seções · ' + kids + ' descobertas' }))));
  });
}

/* ================= boot ================= */
async function boot() {
  applyTema(store.get('tema', 'noite'));
  try { S.meta = await getJSON('data/meta.json'); } catch { $('#view').append(h('div', { class: 'empty', text: 'Não consegui carregar os dados da Bíblia. Recarregue a página.' })); return; }
  S.books = S.meta.books; let k = 0;
  S.books.forEach((bk, b) => { S.chapStart[b] = k; bk.v.forEach((_, c) => { S.chapters.push([b, c + 1]); k++; }); });
  if (!S.books[S.book] || S.chap > S.books[S.book].v.length) { S.book = 0; S.chap = 1; }
  buildAlias();
  temaPicker();
  $$('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
  $('#panelClose').onclick = closePanel; $('#scrim').onclick = closePanel;
  $('#orb').onclick = e => NEURO.open({ from: e.currentTarget });
  $('#fsClose').onclick = () => FS.close();
  $('#brand').onclick = () => setTab('inicio');
  $('#calChip').onclick = () => setTab('mesa');
  $('#searchForm').onsubmit = e => { e.preventDefault(); runSearch($('#busca').value); $('#busca').blur(); };
  document.addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); gotoVerse(+g.dataset.goto); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && NEURO.isOpen) { if (!NEURO.hist.hidden) NEURO.hist.hidden = true; else if (!NEURO.card.hidden) NEURO.deselect(); else NEURO.close(); return; } if (e.key === 'Escape') { if (FS.isOpen && $('#modal').hidden) { FS.close(); return; } if (!$('#modal').hidden) { $('#modal').hidden = true; $('#modal').innerHTML = ''; } else closePanel(); } });
  renderCalChip();
  const hash = (location.hash || '').slice(1);
  if (/^e-[\w.~-]+$/.test(hash)) setTab('descobertas', { estudo: hash.slice(2) }); else setTab(VIEWS[hash] ? hash : 'inicio');
  { let mq = 0; new MutationObserver(() => { if (!mq) mq = requestAnimationFrame(() => { mq = 0; enhance($('#view')); }); }).observe($('#view'), { childList: true, subtree: true }); }
  startDb();
  window.claude?.use?.('sample').then(async s => {
    S.sample = s;
    if (s) { try { const lim = await s.limits?.(); S.sampleTools = !!lim?.tools; } catch { S.sampleTools = false; } }
    $$('[data-chv]').forEach(el => renderChavruta(el, el.dataset.chv ? +el.dataset.chv : null));
  }).catch(() => {});
}
(window.ET?.inicio || Promise.resolve()).then(boot);
})();
</script>
