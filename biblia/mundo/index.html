<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Bíblia RPG — O Mundo</title>
<meta name="description" content="O mundo do Bíblia RPG: ache seu nome e entre na história.">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="../img/bibliarpg-perfil-1080.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--line:#2b3160;--line2:#4a5294;--ouro:#ffd27a;--ouro2:#ffb238;--luz:#ffe9a8;--txt:#ecebf5;--mut:#9a9ab8;--terra:#3a2414}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:20px;line-height:1.2;overscroll-behavior:none}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.px{font-family:'Press Start 2P',monospace}
.app{max-width:620px;margin:0 auto;padding:8px 8px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 8px;gap:8px}
header a{color:inherit;text-decoration:none}
.logo{font-size:11px;color:var(--ouro);text-shadow:2px 2px 0 #000}.logo small{display:block;font-size:7px;color:var(--mut);margin-top:6px}
.hud{flex:1;max-width:300px;background:#000;border:3px solid var(--line2);padding:5px 8px}
.hud .l{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hud .px{font-size:8px;color:var(--ouro)}
.hud .n{font-size:17px;white-space:nowrap}
.bar{height:8px;background:#1c1f36;border:2px solid #000;position:relative;margin-top:4px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ouro2);width:0}
.meta{font-size:15px;color:var(--mut);margin-top:2px}
.tela{position:relative;border:4px solid #000;outline:3px solid var(--line2);background:#05060d;touch-action:none;user-select:none;-webkit-user-select:none;height:min(64vh,560px);overflow:hidden}
.tela canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab}
.tela canvas:active{cursor:grabbing}
.chip{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.75);border:2px solid var(--line2);padding:4px 6px;font-size:8px;color:var(--ouro);pointer-events:none;max-width:60%}
.chip span{display:block;color:var(--mut);font-family:'VT323';font-size:16px;margin-top:3px}
.zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.zoom button,.dpad button,.eu{background:rgba(0,0,0,.72);border:2px solid var(--line2);color:var(--ouro);width:38px;height:38px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:active,.dpad button:active{background:var(--ouro2);color:var(--terra)}
.dpad{position:absolute;right:8px;bottom:8px;display:none;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
.dpad.on{display:grid}
.dpad button{width:40px;height:40px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.eu{position:absolute;left:6px;bottom:6px;width:auto;padding:0 10px;font-size:8px;display:none}
.eu.on{display:flex}
.dica0{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.78);border:2px solid var(--ouro2);padding:6px 10px;font-size:17px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.demo{position:absolute;left:6px;bottom:52px;background:#a3402e;color:#fff;padding:3px 6px;font-size:7px;display:none;pointer-events:none}
.dialogo{background:#0b0d22;border:3px solid var(--txt);box-shadow:inset 0 0 0 3px #0b0d22,inset 0 0 0 5px var(--line2),0 4px 0 #000;padding:10px 12px 12px;min-height:88px;position:relative;margin:12px 0}
.dialogo .quem{font-size:9px;color:var(--ouro);margin-bottom:8px}
.dialogo p{font-size:20px;line-height:1.25}
.dialogo .acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--ouro2);color:var(--terra);border:0;padding:9px 12px;cursor:pointer;box-shadow:inset -3px -3px 0 #a86a10,0 3px 0 #000;font-size:9px}
.btn:active{transform:translateY(2px)}
.btn.sec{background:#1c2048;color:var(--txt);box-shadow:inset -3px -3px 0 #0b0d22,0 3px 0 #000}
.busca{display:flex;gap:6px;margin-bottom:10px}
.busca input{flex:1;min-width:0;background:#000;border:3px solid var(--line2);padding:8px 10px;outline:none}
.busca input:focus{border-color:var(--ouro2)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.menu button{background:#000;border:3px solid var(--line);padding:9px 2px;font-size:8px;cursor:pointer;color:var(--mut)}
.menu button.on{border-color:var(--ouro2);color:var(--ouro)}
.painel{display:none;background:#0b0d22;border:3px solid var(--line2);padding:12px}.painel.on{display:block}
.painel h3{font-size:10px;color:var(--ouro);margin-bottom:10px;line-height:1.5}
.fases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fase{background:#000;border:3px solid var(--line);cursor:pointer;position:relative;text-align:left;padding:0}
.fase canvas{display:block;width:100%;image-rendering:pixelated}
.fase .t{padding:6px 7px}.fase .t b{display:block;font-family:'Press Start 2P';font-size:7px;color:var(--ouro);line-height:1.5;font-weight:normal}
.fase .t span{color:var(--mut);font-size:16px}
.fase .tag{position:absolute;top:4px;right:4px;font-size:7px;padding:3px 4px;background:var(--ouro2);color:var(--terra)}
.fase .tag.lock{background:#1c2048;color:var(--mut)}
.item{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item .n{color:var(--luz)}.item .e{color:var(--ouro);font-size:17px}.item .num{color:var(--mut);font-size:16px}
.vazio{color:var(--mut);text-align:center;padding:18px 6px}
.dica{color:var(--mut);font-size:18px;margin:8px 0}
canvas#carta{display:block;margin:10px auto;width:100%;max-width:280px;border:3px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ouro2);color:var(--terra);padding:8px 14px;display:none;z-index:9;font-size:18px}.toast.on{display:block}
body.cheia{overflow:hidden}
body.cheia .tela{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;border:0;outline:0}
body.cheia .dica0{bottom:calc(10px + env(safe-area-inset-bottom))}
body.cheia .zoom{top:calc(6px + env(safe-area-inset-top))}body.cheia .chip{top:calc(6px + env(safe-area-inset-top))}
body.cheia #dlg{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:51;margin:0;min-height:0;max-height:34vh;overflow:auto;display:none}
body.cheia #dlg.ver{display:block}
body.cheia .dpad{bottom:calc(12px + env(safe-area-inset-bottom))}
.fsbusca{display:none;position:absolute;left:6px;top:calc(62px + env(safe-area-inset-top));width:calc(100% - 64px);max-width:360px;gap:4px}
body.cheia .fsbusca{display:flex}
.fsbusca input{flex:1;min-width:0;background:rgba(0,0,0,.8);border:2px solid var(--line2);padding:6px 8px;outline:none;font-size:18px}
.fsbusca button{font-size:8px;padding:6px 8px}
.zoom button.mudo{color:var(--mut);text-decoration:line-through}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="../" class="logo px">B&Iacute;BLIA RPG<small>O MUNDO</small></a>
    <div class="hud"><div class="l"><span class="px" id="dia">EP. 2</span><span class="n"><b id="nLuzes" style="font-weight:normal;color:var(--luz)">0</b> no mundo</span></div>
      <div class="bar"><i id="barra"></i></div><div class="meta" id="meta">carregando…</div></div>
  </header>

  <div class="busca"><input id="q" placeholder="digite seu nome…" autocomplete="off" enterkeyhint="search"><button class="btn px" id="bq">ACHAR</button></div>

  <div class="tela" id="tela">
    <canvas id="cv"></canvas>
    <div class="chip px" id="chip">O MUNDO<span></span></div>
    <div class="zoom"><button class="px" id="zin" aria-label="Aproximar">+</button><button class="px" id="zout" aria-label="Afastar">−</button><button class="px" id="zall" aria-label="Afastar tudo" style="font-size:9px">▣</button><button class="px" id="fs" aria-label="Tela cheia" style="font-size:16px">⛶</button><button class="px" id="som" aria-label="Som" style="font-size:15px">♪</button></div>
    <div class="fsbusca"><input id="q2" placeholder="ache seu nome…" autocomplete="off" enterkeyhint="search"><button class="btn px" id="bq2">ACHAR</button></div>
    <button class="eu px" id="eu">◎ EU</button>
    <div class="dpad" id="dpad"><button class="u px" data-d="0,-1">▲</button><button class="l px" data-d="-1,0">◀</button><button class="r px" data-d="1,0">▶</button><button class="d px" data-d="0,1">▼</button></div>
    <div class="dica0" id="dica0">arraste · pinça = zoom · toque</div>
    <div class="demo px" id="demo">MODO DEMONSTRAÇÃO</div>
  </div>

  <div class="dialogo" id="dlg"><div class="quem px" id="dlgQuem">NARRADOR</div><p id="dlgTxt"></p><div class="acoes" id="acoes"></div></div>

  <a class="btn px" href="../criar/" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px;font-size:10px;padding:13px">+ CRIAR MEU PERSONAGEM</a>
  <div class="menu">
    <button class="px on" data-p="fases">LUGARES</button><button class="px" data-p="livro">LIVRO</button><button class="px" data-p="carta">CARTA</button>
  </div>
  <section class="painel on" id="p-fases"><h3>LUGARES DO MUNDO</h3><div id="fases"></div>
    <p class="dica">Os lugares apagados ainda não foram alcançados. Eles abrem conforme a comunidade cresce.</p></section>
  <section class="painel" id="p-livro"><h3>O LIVRO DA VIDA</h3><div class="busca"><input id="ql" placeholder="filtrar por nome…" autocomplete="off"></div><div class="dica" id="tot"></div><div id="lista"></div></section>
  <section class="painel" id="p-carta"><h3>SUA CARTA</h3><div class="busca"><input id="qc" placeholder="seu nome como está no Livro…" autocomplete="off"><button class="btn px" id="bc">GERAR</button></div><canvas id="carta" width="270" height="480"></canvas><div style="text-align:center"><button class="btn px" id="baixar">BAIXAR PARA O STORY</button></div></section>
</div>
<div class="toast" id="toast"></div>
<script src="../som.js?v=1794995004"></script>
<script src="../cenas.js?v=1794995004"></script>
<script src="../mapa.js?v=1794995423"></script>
<script>
const {chave,pessoa,ser}=BRPG, MP=BRPG_MAPA, {MW,MH,LUGARES}=MP;
const $=s=>document.querySelector(s);
const demo=new URLSearchParams(location.search).has('demo');
let dados={pessoas:[],estado:{dia:1,seguidores:0,meta:50}},foco=null,meuId=null,meuPos=null,pos=[];
try{meuId=Number(localStorage.getItem('biblia_meu_id'))||null;meuPos=JSON.parse(localStorage.getItem('biblia_meu_xy')||'null')}catch(e){}
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2400)}

/* ---------- mapa e câmera ---------- */
const BASE=MP.montar(),NEVOA=MP.nevoa();
const cv=$('#cv'),c=cv.getContext('2d');let DPR=1,CW=0,CH=0;
function medir(){DPR=Math.min(2.5,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();CW=Math.round(r.width*DPR);CH=Math.round(r.height*DPR);cv.width=CW;cv.height=CH;c.imageSmoothingEnabled=false}
window.addEventListener('resize',()=>{medir();limitar()});medir();
const cam={x:800,y:600,z:2},alvo={on:false,x:0,y:0,z:2};let seguir=null;
function zMin(){const r=cv.getBoundingClientRect();return Math.max(r.width/MW,r.height/MH)}
function zMax(){return 10}
function limitar(){cam.z=Math.max(zMin(),Math.min(zMax(),cam.z));const r=cv.getBoundingClientRect(),hw=r.width/2/cam.z,hh=r.height/2/cam.z;
  cam.x=hw*2>=MW?MW/2:Math.max(hw,Math.min(MW-hw,cam.x));cam.y=hh*2>=MH?MH/2:Math.max(hh,Math.min(MH-hh,cam.y))}
function voar(x,y,z){alvo.on=true;alvo.x=x;alvo.y=y;alvo.z=z}

/* ---------- falas ---------- */
const FALAS={camelo:['Atravesso qualquer deserto!'],raposa:['Sou a mais esperta do Éden'],tigre:['Grrr! Rei do jardim'],onca:['Rawr! Ninguém me alcança'],cao:['Au au! Caramelo raiz'],
  serpente:['Hsss… prova o fruto?'],sol:['Brilhando desde o dia 4 ☀'],cosmos:['Galáxias e mais galáxias ✨'],
  querubim:['Ninguém passa pela porta!','A espada não se apaga'],portao:['Comenta meu código aí!','Quase entrando…'],
  gente:['Shalom!','Bora construir Enoque!','Já comentou seu nome?','Bora pros 200!','Cadê a Eva?','Chama mais gente!','Poço, muro ou altar?']};
let fala=null,ultimaFala=0;
function novaFala(t){const vis=pos.filter(q=>visivel(q.x,q.y));if(!vis.length)return;const q=vis[Math.floor(Math.random()*vis.length)];
  let ops=FALAS[q.z==='querubim'?'querubim':q.z==='portao'?'portao':q.k]||FALAS.gente;if(norm(q.p.forma)==='adao')ops=['Sou o Adão!','Saudade do jardim…'];
  fala={id:q.p.id,txt:ops[Math.floor(Math.random()*ops.length)],t0:t}}
function visivel(x,y){const r=cv.getBoundingClientRect(),hw=r.width/2/cam.z,hh=r.height/2/cam.z;return x>cam.x-hw&&x<cam.x+hw&&y>cam.y-hh&&y<cam.y+hh}

/* ---------- desenho ---------- */
function P(x,y){return [(x-cam.x)*cam.z*DPR+CW/2,(y-cam.y)*cam.z*DPR+CH/2]}
function frame(ms){const t=ms/1000;
  if(alvo.on){const k=.1;cam.x+=(alvo.x-cam.x)*k;cam.y+=(alvo.y-cam.y)*k;cam.z+=(alvo.z-cam.z)*k;if(!seguir&&Math.abs(alvo.z-cam.z)<.01&&Math.hypot(alvo.x-cam.x,alvo.y-cam.y)<.5)alvo.on=false}
  if(meuId&&(mov.x||mov.y))andarEu();
  limitar();
  const z=cam.z*DPR;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#05060d';c.fillRect(0,0,CW,CH);
  c.setTransform(z,0,0,z,CW/2-cam.x*z,CH/2-cam.y*z);c.imageSmoothingEnabled=false;
  c.drawImage(BASE,0,0);
  // animação no mapa: brilho na água, fogo do acampamento, espada dos querubins
  for(let i=0;i<24;i++){const a=BRPG.hash(i*7)%420+30,b=BRPG.hash(i*13)%1000+80;c.globalAlpha=.4+.4*Math.sin(t*2+i);c.fillStyle='#cfe6ff';c.fillRect(a+Math.sin(t+i)*4,b,3,1)}c.globalAlpha=1;
  const A=MP.L.acampamento,E=MP.L.eden;for(let i=0;i<5;i++){const fx=A.x+Math.sin(t*9+i)*2,h=5+3*Math.sin(t*13+i*2);c.fillStyle=['#ff7a1e','#ffb432','#ffe678'][i%3];c.beginPath();c.moveTo(fx-3,A.y+5);c.lineTo(fx,A.y+5-h);c.lineTo(fx+3,A.y+5);c.fill()}
  for(let k=0;k<10;k++){const fl=.5+.5*Math.sin(t*15+k);c.fillStyle=fl>.5?'#ffe678':'#ff6a1e';c.fillRect(E.x+117+Math.sin(t*10+k),E.y-24+k*3,2,3)}
  // pessoas
  pos.forEach(q=>{if(q.anda&&!(meuId===q.p.id&&meuPos)){const amp=q.z==='portao'?2:8+(q.p.id%9);q.x=q.bx+Math.sin(t*.25+q.f)*amp;q.y=q.by+Math.cos(t*.18+q.f)*amp*.4}
    if(meuId===q.p.id&&meuPos){q.x=meuPos.x;q.y=meuPos.y}});
  const ordem=pos.filter(q=>visivel(q.x,q.y)).sort((a,b)=>a.y-b.y);
  ordem.forEach(q=>{c.globalAlpha=q.p.status==='pendente'?.45:1;
    if(q.z==='querubim'){pessoa(c,q.x,q.y,q.p.id,t,false,Object.assign({r:9,f:7,p:1},q.p.aparencia||{}));c.fillStyle='#eef0ff';c.fillRect(q.x-8,q.y-9+Math.sin(t*6),3,5);c.fillRect(q.x+5,q.y-9+Math.sin(t*6),3,5);c.fillStyle='#ffe896';c.fillRect(q.x-3,q.y-17,6,1)}
    else if(q.z==='jardim'||q.z==='arvore'||q.z==='sol'||q.z==='cosmos')ser(c,{p:q.p,x:q.x,y:q.y,f:q.f},t);
    else pessoa(c,q.x,q.y,q.p.id,t,q.anda,q.p.aparencia);
    c.globalAlpha=1});
  // névoa por cima
  c.drawImage(NEVOA,0,0);
  c.setTransform(1,0,0,1,0,0);
  placas(t);rotulos(t,ordem);
  if(t-ultimaFala>2.6){ultimaFala=t;novaFala(t)}
  if(fala&&t-fala.t0<3.2){const q=pos.find(v=>v.p.id===fala.id);if(q&&visivel(q.x,q.y))balao(q,q.p.nome+': '+fala.txt)}
  if(meuId){const q=pos.find(v=>v.p.id===meuId);if(q&&visivel(q.x,q.y)){const [x,y]=P(q.x,q.y-18);const yy=y-10*DPR+Math.sin(t*5)*3*DPR;c.fillStyle='#ffb238';c.beginPath();c.moveTo(x-7*DPR,yy-10*DPR);c.lineTo(x+7*DPR,yy-10*DPR);c.lineTo(x,yy);c.fill()}}
  // chip
  const lg=MP.lugarEm(cam.x,cam.y);const id=lg?lg.id:'';if(frame._l!==id){frame._l=id;
    $('#chip').innerHTML=lg?esc(lg.nome.toUpperCase())+'<span>'+esc(lg.ref)+(lg.status==='agora'?' · AGORA':lg.status==='proxima'?' · PRÓXIMO':' · ainda não chegamos')+'</span>':'O MUNDO<span>arraste para explorar</span>';
    if(window.BRPG_SOM)BRPG_SOM.cena(!lg?'misterio':lg.id==='eden'?'eden':(lg.id==='enoque'||lg.id==='acampamento')?'enoque':'misterio')}
  requestAnimationFrame(frame)}

function placas(t){c.textAlign='center';const ocup=[];const sa=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(cam.z<.9){c.font=(13*DPR)+'px "Press Start 2P"';c.fillStyle='rgba(255,236,200,.35)';MP.REGIOES.forEach(g=>{if(!visivel(g.x,g.y))return;const [x,y]=P(g.x,g.y);c.fillText(sa(g.n),x,y)})}
  const lista=LUGARES.filter(l=>l.grande||(l.importante&&cam.z>=.42)||cam.z>=1.0).sort((a,b)=>(b.status==='agora')-(a.status==='agora')||(b.grande?1:0)-(a.grande?1:0)||(b.importante?1:0)-(a.importante?1:0));
  for(const l of lista){if(!visivel(l.x,l.y))continue;
    const grande=!!l.grande,fs=(grande?10:8)*DPR;
    const [x,y0]=P(l.x,l.y);const y=y0-(grande?Math.min(l.r*cam.z*DPR*.7,60*DPR):14*DPR);c.font=fs+'px "Press Start 2P"';
    const nome=sa(l.nome.toUpperCase()),w=c.measureText(nome).width+10*DPR,h=fs+8*DPR;
    if(ocup.some(r=>x-w/2<r[0]+r[2]&&x+w/2>r[0]&&y-h/2<r[1]+r[3]&&y+h/2>r[1]))continue;ocup.push([x-w/2,y-h/2,w,h]);
    const ab=l.status==='agora',pr=l.status==='proxima';
    if(!grande){c.fillStyle=ab?'#ffb238':'#c8b088';c.fillRect(x-2*DPR,y0-2*DPR,4*DPR,4*DPR)}
    c.fillStyle=ab?'rgba(58,36,20,.92)':pr?'rgba(40,30,20,.85)':'rgba(10,12,26,.78)';c.fillRect(x-w/2,y-h/2,w,h);
    c.fillStyle=ab?'#ffb238':pr?'#a87a3a':'#3a3f66';c.fillRect(x-w/2,y+h/2-2*DPR,w,2*DPR);
    c.fillStyle=ab?'#ffd27a':pr?'#e8c890':'#a8acd0';c.fillText(nome,x,y+fs*.38)}
  c.textAlign='left'}

function rotulos(t,ordem){if(cam.z<2.2)return;const ocup=[];
  const pri=q=>(q.p.id===meuId?3:foco&&q.p.id===foco.id?2:q.p.pioneiro?1:0);
  const lista=ordem.slice().sort((a,b)=>pri(b)-pri(a)).slice(0,45);
  c.font=(15*DPR)+'px VT323';
  for(const q of lista){const forte=pri(q)>=2,pio=q.p.pioneiro;
    const txt=(q.p.status==='pendente'?'⏳ ':'')+(pio?'★ ':'')+(q.p.id===meuId?'VOCÊ · ':'')+q.p.nome+(cam.z>=3.5||forte?' · '+q.p.escolha:'');
    const w=c.measureText(txt).width+8*DPR,h=14*DPR;let [x,y]=P(q.x,q.y-(q.z==='sol'||q.z==='cosmos'?12:17));x-=w/2;y-=h;
    if(!forte&&ocup.some(r=>x<r[0]+r[2]&&x+w>r[0]&&y<r[1]+r[3]&&y+h>r[1]))continue;ocup.push([x,y,w,h]);
    c.globalAlpha=q.p.status==='pendente'?.75:1;
    c.fillStyle=forte?'#ffb238':pio?'rgba(58,36,20,.92)':'rgba(4,5,11,.8)';c.fillRect(x,y,w,h);
    c.fillStyle=forte?'#3a2414':pio?'#ffd27a':'#ffe9a8';c.fillText(txt,x+4*DPR,y+11*DPR);c.globalAlpha=1}}

function balao(q,txt){c.font=(16*DPR)+'px VT323';const w=Math.min(c.measureText(txt).width+14*DPR,CW*.9),h=19*DPR;
  let [x,y]=P(q.x,q.y-18);x-=w/2;y-=h+(cam.z>=2.2?18*DPR:6*DPR);x=Math.max(4,Math.min(CW-w-4,x));y=Math.max(4,y);
  c.fillStyle='#000';c.fillRect(x-2*DPR,y-2*DPR,w+4*DPR,h+4*DPR);c.fillStyle='#fff';c.fillRect(x,y,w,h);
  c.fillStyle='#111';c.fillText(txt,x+7*DPR,y+14*DPR,w-14*DPR)}

/* ---------- toque, arrastar, pinça ---------- */
const ptr=new Map();let moveu=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moveu=0;alvo.on=false;seguir=null;$('#dica0').style.opacity=0});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p0=ptr.get(e.pointerId),p1={x:e.clientX,y:e.clientY};
  if(ptr.size===1){cam.x-=(p1.x-p0.x)/cam.z;cam.y-=(p1.y-p0.y)/cam.z;moveu+=Math.abs(p1.x-p0.x)+Math.abs(p1.y-p0.y)}
  else if(ptr.size===2){const o=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(p0.x-o.x,p0.y-o.y),d1=Math.hypot(p1.x-o.x,p1.y-o.y);
    const r=cv.getBoundingClientRect();zoomEm(d1/Math.max(1,d0),(p1.x+o.x)/2-r.left,(p1.y+o.y)/2-r.top);moveu+=99}
  ptr.set(e.pointerId,p1);limitar()});
cv.addEventListener('pointerup',e=>{if(ptr.size===1&&moveu<8)tocar(e);ptr.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomEm(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);alvo.on=false},{passive:false});
function zoomEm(f,mx,my){const r=cv.getBoundingClientRect(),wx=cam.x+(mx-r.width/2)/cam.z,wy=cam.y+(my-r.height/2)/cam.z;
  cam.z=Math.max(zMin(),Math.min(zMax(),cam.z*f));cam.x=wx-(mx-r.width/2)/cam.z;cam.y=wy-(my-r.height/2)/cam.z;limitar()}
$('#zin').onclick=()=>voar(cam.x,cam.y,Math.min(zMax(),cam.z*1.6));$('#zout').onclick=()=>voar(cam.x,cam.y,Math.max(zMin(),cam.z/1.6));
$('#zall').onclick=()=>{seguir=null;voar(MW/2,MH/2,zMin())};
function tocar(e){const r=cv.getBoundingClientRect(),wx=cam.x+(e.clientX-r.left-r.width/2)/cam.z,wy=cam.y+(e.clientY-r.top-r.height/2)/cam.z;
  let best=null,d=1e9;for(const q of pos){const dd=Math.hypot(q.x-wx,q.y-6-wy);if(dd<d){d=dd;best=q}}
  if(best&&d*cam.z<30){mostrar(best.p);fala={id:best.p.id,txt:best.p.id===meuId?'Sou eu! 👋':'Oi! 👋',t0:performance.now()/1000};return}
  const l=MP.lugarEm(wx,wy);if(l)falarLugar(l)}
function falarLugar(l){dizer((l.status==='agora'?'':l.status==='proxima'?'PRÓXIMO · ':'🔒 ')+l.nome.toUpperCase()+' · '+l.ref,l.texto+(l.status==='breve'?' Ainda não chegamos aqui: a região abre conforme a comunidade cresce.':''),
  l.status!=='agora'?[['CRIAR MEU PERSONAGEM',()=>location.href='../criar/']]:null)}

/* ---------- diálogo e fichas ---------- */
let dlgTimer=null;
function dizer(quem,txt,acoes){const D=$('#dlg');D.classList.add('ver');clearTimeout(dizer._);dizer._=setTimeout(()=>{if(document.body.classList.contains('cheia'))D.classList.remove('ver')},9000);
  $('#dlgQuem').textContent=quem;const p=$('#dlgTxt');clearInterval(dlgTimer);let i=0;p.textContent='';
  dlgTimer=setInterval(()=>{i+=2;p.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(dlgTimer)},18);
  const a=$('#acoes');a.innerHTML='';(acoes||[]).forEach(([rot,fn,sec])=>{const b=document.createElement('button');b.className='btn px'+(sec?' sec':'');b.textContent=rot;b.onclick=fn;a.appendChild(b)})}
function mostrar(p){foco=p;
  if(p.status==='pendente'){dizer('⏳ '+p.nome.toUpperCase()+' · PENDENTE','Quer ser '+p.escolha+'. Está esperando na porta de Enoque. Para entrar na história: siga @bibliarpg e comente o código '+(p.codigo||'')+' no último post.',[['ABRIR O INSTAGRAM',()=>open('https://instagram.com/bibliarpg','_blank')],['SOU EU ✋',()=>souEu(p),true]]);return}
  const ac=p.id===meuId?[['ANDAR COM MEU PERSONAGEM',()=>{ativarEu();toast('Use as setas para andar')}]]:[['SOU EU ✋',()=>souEu(p)],['VER CARTA',()=>{$('#qc').value=p.nome;abrir('carta');carta(p);$('#p-carta').scrollIntoView({behavior:'smooth'})},true]];
  dizer((p.pioneiro?'★ ':'')+p.nome.toUpperCase()+' · Nº '+String(p.id).padStart(4,'0'),(p.pioneiro?'Pioneiro: um dos 12 primeiros. ':'')+'Escolheu ser '+p.escolha+'. Trilha: '+(p.trilha||['Luz']).join(' → ')+'.',ac)}
function souEu(p){meuId=p.id;try{localStorage.setItem('biblia_meu_id',meuId)}catch(e){}ativarEu();mostrar(p);toast('Agora é você! Use as setas para andar.')}

/* ---------- achar ---------- */
function achar(){const q=norm($('#q').value);if(!q)return;$('#q').blur();
  const p=dados.pessoas.find(x=>norm(x.nome)===q)||dados.pessoas.find(x=>norm(x.nome).startsWith(q))||dados.pessoas.find(x=>norm(x.nome).includes(q));
  if(!p){dizer('NARRADOR','Ainda não achei "'+$('#q').value+'". Crie o seu personagem: ele aparece no mundo e entra na história quando você segue @bibliarpg e comenta o código.',[['CRIAR MEU PERSONAGEM',()=>location.href='../criar/']]);return}
  irAte(p);if(!document.body.classList.contains('cheia'))$('#tela').scrollIntoView({behavior:'smooth',block:'center'})}
function irAte(p){const q=pos.find(x=>x.p.id===p.id);if(!q)return;seguir=p.id;voar(q.x,q.y-10,5);mostrar(p);
  fala={id:p.id,txt:p.id===meuId?'Voltei! 👋':'Aqui! Sou '+p.nome+' 👋',t0:performance.now()/1000+.8}}
$('#bq').onclick=achar;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')achar()});
$('#bq2').onclick=()=>{$('#q').value=$('#q2').value;achar()};$('#q2').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#q').value=$('#q2').value;achar()}});
// seguir o personagem enquanto ele anda
setInterval(()=>{if(seguir){const q=pos.find(x=>x.p.id===seguir);if(q){alvo.on=true;alvo.x=q.x;alvo.y=q.y-10}}},50);

/* ---------- andar com o próprio personagem ---------- */
const mov={x:0,y:0};
function ativarEu(){$('#dpad').classList.add('on');$('#eu').classList.add('on')}
function andarEu(){const q=pos.find(x=>x.p.id===meuId);if(!q)return;const b=meuPos||{x:q.x,y:q.y};
  meuPos={x:Math.max(10,Math.min(MW-10,b.x+mov.x*1.2)),y:Math.max(20,Math.min(MH-10,b.y+mov.y*1.2))};seguir=meuId;
  clearTimeout(andarEu._);andarEu._=setTimeout(()=>{try{localStorage.setItem('biblia_meu_xy',JSON.stringify(meuPos))}catch(e){}},400)}
document.querySelectorAll('.dpad button').forEach(b=>{const [dx,dy]=b.dataset.d.split(',').map(Number);
  b.addEventListener('pointerdown',e=>{e.preventDefault();mov.x=dx;mov.y=dy});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{mov.x=0;mov.y=0}))});
$('#eu').onclick=()=>{const p=dados.pessoas.find(x=>x.id===meuId);if(p)irAte(p)};
const TECLAS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!TECLAS[e.key])return;e.preventDefault();
  if(meuId&&$('#dpad').classList.contains('on')){[mov.x,mov.y]=TECLAS[e.key]}else{cam.x+=TECLAS[e.key][0]*40/cam.z;cam.y+=TECLAS[e.key][1]*40/cam.z;alvo.on=false;seguir=null}});
document.addEventListener('keyup',e=>{if(TECLAS[e.key]){mov.x=0;mov.y=0}});

/* ---------- tela cheia ---------- */
function telaCheia(on){document.body.classList.toggle('cheia',on);$('#fs').textContent=on?'✕':'⛶';const el=document.documentElement;
  try{if(on&&el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(()=>{medir();limitar()},60);setTimeout(()=>{medir();limitar()},400)}
$('#fs').onclick=()=>telaCheia(!document.body.classList.contains('cheia'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('cheia'))telaCheia(false)});
$('#dlg').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON'&&document.body.classList.contains('cheia'))$('#dlg').classList.remove('ver')});

/* ---------- painéis ---------- */
function abrir(p){document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.querySelectorAll('.painel').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));if(p==='carta')autoCarta()}
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>abrir(b.dataset.p));
function montarLugares(){const ord={agora:0,proxima:1,breve:2};
  $('#fases').innerHTML=LUGARES.slice().sort((a,b)=>ord[a.status]-ord[b.status]).map(l=>'<div class="item" data-l="'+l.id+'"><div><div class="n">'+(l.status==='breve'?'🔒 ':'')+esc(l.nome)+'</div><div class="e" style="color:var(--mut)">'+esc(l.ref)+'</div></div><div class="num" style="color:'+(l.status==='agora'?'var(--ouro2)':'var(--mut)')+'">'+(l.status==='agora'?'AGORA':l.status==='proxima'?'PRÓXIMO':'em breve')+'</div></div>').join('');
  document.querySelectorAll('#fases .item').forEach(el=>el.onclick=()=>{const l=MP.L[el.dataset.l];seguir=null;voar(l.x,l.y,l.grande?Math.max(1.2,Math.min(3,260/l.r)):2.5);falarLugar(l);$('#tela').scrollIntoView({behavior:'smooth',block:'center'})})}
$('#ql').addEventListener('input',livro);
function livro(){const q=norm($('#ql').value);const r=dados.pessoas.filter(p=>!q||norm(p.nome).includes(q)).sort((a,b)=>(b.pioneiro-a.pioneiro)||norm(a.nome).localeCompare(norm(b.nome)));
  $('#tot').textContent=r.length+' '+(r.length===1?'nome':'nomes')+' · toque para ir até a pessoa';
  $('#lista').innerHTML=r.length?r.slice(0,500).map(p=>'<div class="item" data-id="'+p.id+'"><div><div class="n">'+(p.status==='pendente'?'⏳ ':'')+(p.pioneiro?'★ ':'')+esc(p.nome)+(p.id===meuId?' <span style="color:var(--ouro2)">· você</span>':'')+'</div><div class="e">'+esc(p.escolha)+'</div></div><div class="num">Nº '+String(p.id).padStart(4,'0')+'</div></div>').join('')
  :'<div class="vazio">O livro ainda está em branco. Seja o primeiro nome.</div>';
  document.querySelectorAll('#lista .item').forEach(el=>el.onclick=()=>{const p=dados.pessoas.find(x=>x.id===+el.dataset.id);if(p){irAte(p);$('#tela').scrollIntoView({behavior:'smooth',block:'center'})}})}
/* carta */
const cc=$('#carta').getContext('2d');let cartaP=null;
function autoCarta(){const p=meuId?dados.pessoas.find(x=>x.id===meuId):null;if(p){$('#qc').value=p.nome;carta(p)}else carta(null)}
$('#bc').onclick=()=>{const q=norm($('#qc').value);const p=dados.pessoas.find(x=>norm(x.nome)===q)||dados.pessoas.find(x=>norm(x.nome).startsWith(q));if(!p){toast('Esse nome ainda não está no Livro');return}carta(p)};
function carta(p){cartaP=p;const c=cc,w=270,h=480;c.imageSmoothingEnabled=false;c.fillStyle='#07080f';c.fillRect(0,0,w,h);c.fillStyle='#2b3160';c.fillRect(6,6,w-12,3);c.fillRect(6,h-9,w-12,3);c.fillRect(6,6,3,h-12);c.fillRect(w-9,6,3,h-12);
  for(let i=0;i<60;i++){const a=BRPG.hash((p?p.id:7)*131+i),b=BRPG.hash((p?p.id:7)*977+i);c.fillStyle=i%5?'#3a3f66':'#ffe9a8';c.fillRect(16+a%(w-32),16+b%200,1,1)}
  c.save();c.translate(w/2,180);c.scale(6,6);pessoa(c,0,0,p?p.id:7,0,false,p&&p.aparencia);c.restore();
  c.textAlign='center';c.fillStyle='#9a9ab8';c.font='8px "Press Start 2P"';c.fillText('BIBLIA RPG',w/2,34);
  c.fillStyle='#ffd27a';c.font='9px "Press Start 2P"';c.fillText(p?(p.pioneiro?'★ PIONEIRO · ':'')+'Nº '+String(p.id).padStart(4,'0'):'Nº ????',w/2,210);
  c.fillStyle='#ecebf5';let nm=(p?p.nome:'SEU NOME').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,''),fs=14;c.font=fs+'px "Press Start 2P"';while(c.measureText(nm).width>w-40&&fs>8){fs--;c.font=fs+'px "Press Start 2P"'}c.fillText(nm,w/2,238);
  c.fillStyle='#ffd27a';c.font='22px VT323';c.fillText(p?p.escolha:'comente nome + o que quer ser',w/2,266);
  c.fillStyle='#ecebf5';c.font='20px VT323';c.fillText('"E viu Deus que era muito bom."',w/2,392);c.fillStyle='#9a9ab8';c.font='18px VT323';c.fillText('Gênesis 1:31',w/2,412);
  c.fillStyle='#ffb238';c.fillRect(w/2-70,432,140,20);c.fillStyle='#3a2414';c.font='8px "Press Start 2P"';c.fillText('@BIBLIARPG',w/2,446)}
$('#baixar').onclick=()=>{if(!cartaP){toast('Gere sua carta primeiro');return}const b=document.createElement('canvas');b.width=1080;b.height=1920;const x=b.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage($('#carta'),0,0,1080,1920);const a=document.createElement('a');a.download='carta-biblia-rpg-'+cartaP.id+'.png';a.href=b.toDataURL('image/png');a.click()};

/* ---------- carregar ---------- */
async function iniciar(){try{dados=await BRPG.carregar(demo)}catch(e){console.error(e)}
  $('#demo').style.display=dados.demo?'block':'none';
  const velhas=Object.fromEntries(pos.map(q=>[q.p.id,q]));pos=MP.posicionar(dados.pessoas);pos.forEach(q=>{const v=velhas[q.p.id];if(v){q.x=v.x;q.y=v.y}});
  const e=dados.estado;$('#dia').textContent='EP. '+e.dia+' · '+(e.titulo||'').toUpperCase();$('#nLuzes').textContent=dados.pessoas.filter(p=>p.status!=='pendente').length;
  $('#barra').style.width=(e.meta?Math.min(100,Math.round(e.seguidores/e.meta*100)):0)+'%';
  const f=Math.max(0,e.meta-e.seguidores);$('#meta').textContent=f>0?'faltam '+f+' seguidores para o Ep. '+(e.dia+1):'meta batida — o próximo episódio vem aí';
  livro()}
cam.z=1.2;cam.x=1700;cam.y=1030;limitar();
montarLugares();requestAnimationFrame(frame);document.fonts.ready.then(()=>carta(null));
dizer('NARRADOR','Bem-vindo ao mundo do Bíblia RPG! Você está no Éden, guardado pelos querubins. A leste, o acampamento e a cidade de Enoque. Afaste o mapa para ver toda a terra de Israel, o Egito e a Mesopotâmia: tudo apagado, porque ainda não chegamos lá. Digite seu nome lá em cima ou arraste para explorar.');
iniciar().then(()=>{const q=new URLSearchParams(location.search).get('nome');if(q){$('#q').value=q;achar()}else if(meuId){const p=dados.pessoas.find(x=>x.id===meuId);if(p){irAte(p);ativarEu()}}});
setInterval(()=>iniciar(),60000);
/* som */
(function(){const S=window.BRPG_SOM,b=$('#som');if(!S)return;
  const pinta=on=>{b.classList.toggle('mudo',!on);b.title=on?'Desligar som':'Ligar som'};pinta(false);S.aoMudar(pinta);
  b.onclick=e=>{e.stopPropagation();S.alternar()};
  const primeiro=e=>{if(e&&e.target&&e.target.closest&&e.target.closest('#som'))return;if(S.preferencia!=='off'&&!S.ligado)S.ligar();['pointerdown','touchend','keydown'].forEach(ev=>document.removeEventListener(ev,primeiro,true))};
  ['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,primeiro,true))})();
