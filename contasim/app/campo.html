<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Leitura em campo — Conta Sim Digital</title>
<link rel="stylesheet" href="assets/css/style.css?v=78">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <button class="topbar-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar
    </button>
    <div class="logo-header"><img src="assets/img/logo-consigaz-branca.png" alt="Consigaz"></div>
    <div class="topbar-title">Leitura de medidor</div>
  </div>

  <div class="screen">

    <div class="field" id="seletorUnidade">
      <label for="selectUnidade">Unidade</label>
      <select id="selectUnidade"></select>
    </div>

    <div class="photo-frame" id="molduraFoto">
      <div class="placeholder" id="placeholderFoto">
        <div style="font-size:32px; margin-bottom:8px;">📷</div>
        <div>Toque para fotografar o medidor</div>
      </div>
      <img id="previewFoto" style="display:none;">
    </div>
    <div id="painelAjuste" style="display:none; margin:-4px 0 16px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:18px;">🔍</span>
        <input type="range" id="zoomFoto" min="0" max="100" value="0" style="flex:1;" aria-label="Aproximar ou afastar a foto">
        <button type="button" class="btn btn-outline" id="btnRestaurarFoto" style="padding:6px 12px; font-size:13px; min-height:0;">Restaurar</button>
      </div>
      <div class="hint" style="margin-top:6px;">Arraste a foto com o dedo e use o controle (ou pinça) para encaixar o medidor no quadro.</div>
    </div>
    <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="inputFotoGaleria" accept="image/*" style="display:none;">
    <div style="display:flex; gap:10px; margin-bottom:16px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('inputFoto').click()">
        📷 Tirar foto
      </button>
      <button class="btn btn-outline" style="flex:1;" onclick="document.getElementById('inputFotoGaleria').click()">
        🖼️ Da galeria
      </button>
    </div>

    <button class="btn btn-primary btn-block" id="btnExtrair" onclick="extrairComIA()" style="display:none; margin-bottom:20px;">
      Ler com IA
    </button>

    <div id="camposLeitura" style="display:none;">
      <div class="field">
        <label for="numeroSerie">Nº de série do medidor</label>
        <input type="text" id="numeroSerie" class="mono">
      </div>
      <div class="field">
        <label for="leituraM3">Leitura (m³)</label>
        <input type="text" id="leituraM3" class="mono digit-input" style="font-size:26px; letter-spacing:3px;" inputmode="decimal">
        <div class="hint">Confira o valor extraído antes de salvar.</div>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-primary btn-block" id="btnSalvar" onclick="salvarLeitura()" disabled>
      Salvar leitura
    </button>

    <p class="center-text muted" style="font-size:12px; margin-top:20px;">© 2026 Diogo Soares. Todos os direitos reservados.</p>
  </div>
</div>

<script src="assets/js/supabase-client.js?v=78"></script>
<script>
const params = new URLSearchParams(window.location.search);
let unidadeId = params.get('unidade');
const condominioId = params.get('condominio');
let fotoBase64 = null;
let fotoMediaType = null;
let coordenadas = null;
let perfilAtual = null;

async function iniciar() {
  await exigirSessao();
  perfilAtual = await obterPerfil();

  navigator.geolocation?.getCurrentPosition(
    pos => { coordenadas = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
    () => {}
  );

  if (unidadeId) {
    document.getElementById('seletorUnidade').style.display = 'none';
    const { data } = await sb.from('csd_unidades').select('*').eq('id', unidadeId).single();
    if (data) document.querySelector('.topbar-title').textContent = [data.torre, data.bloco, data.apto].filter(Boolean).join(' / ');
  } else {
    await carregarUnidadesPendentes();
  }
}

async function carregarUnidadesPendentes() {
  let query = sb.from('csd_unidades').select('*, csd_condominios(nome)').order('apto');
  if (condominioId) query = query.eq('condominio_id', condominioId);
  const { data } = await query;
  const select = document.getElementById('selectUnidade');
  select.innerHTML = (data || []).map(u =>
    `<option value="${u.id}">${[u.torre, u.bloco, u.apto].filter(Boolean).join(' / ')} — ${escapeHtml(u.csd_condominios?.nome || '')}</option>`
  ).join('');
  select.addEventListener('change', () => { unidadeId = select.value; });
  if (data && data.length) unidadeId = data[0].id;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

document.getElementById('inputFoto').addEventListener('change', (e) => processarFoto(e));
document.getElementById('inputFotoGaleria').addEventListener('change', (e) => processarFoto(e));

// ---------- Ajuste da foto dentro do quadro (arrastar + zoom) ----------
const aj = { img: null, nw: 0, nh: 0, fw: 0, fh: 0, scale: 1, min: 1, max: 1, x: 0, y: 0, ptrs: new Map(), pinch0: null };

function ajLimitar() {
  // Mantém a foto cobrindo o quadro quando possível; se estiver menor que o quadro, centraliza
  const w = aj.nw * aj.scale, h = aj.nh * aj.scale;
  aj.x = w <= aj.fw ? (aj.fw - w) / 2 : Math.min(0, Math.max(aj.fw - w, aj.x));
  aj.y = h <= aj.fh ? (aj.fh - h) / 2 : Math.min(0, Math.max(aj.fh - h, aj.y));
}

function ajRender() {
  ajLimitar();
  const el = document.getElementById('previewFoto');
  el.style.transform = `translate(${aj.x}px, ${aj.y}px) scale(${aj.scale})`;
  const z = document.getElementById('zoomFoto');
  z.value = String(Math.round((Math.log(aj.scale / aj.min) / Math.log(aj.max / aj.min)) * 100) || 0);
}

function ajZoomPara(novaEscala, cx, cy) {
  novaEscala = Math.min(aj.max, Math.max(aj.min, novaEscala));
  const k = novaEscala / aj.scale;
  aj.x = cx - (cx - aj.x) * k;
  aj.y = cy - (cy - aj.y) * k;
  aj.scale = novaEscala;
  ajRender();
}

function ajReiniciar() {
  const frame = document.getElementById('molduraFoto');
  aj.fw = frame.clientWidth; aj.fh = frame.clientHeight;
  const cover = Math.max(aj.fw / aj.nw, aj.fh / aj.nh);
  const contain = Math.min(aj.fw / aj.nw, aj.fh / aj.nh);
  aj.min = contain;                 // dá pra afastar até ver a foto inteira
  aj.max = Math.max(cover * 4, contain * 1.5);
  aj.scale = cover;
  aj.x = (aj.fw - aj.nw * aj.scale) / 2;
  aj.y = (aj.fh - aj.nh * aj.scale) / 2;
  ajRender();
  ajAplicar();
}

// Recorta exatamente o que está dentro do quadro e usa como foto a enviar/ler
function ajAplicar() {
  if (!aj.img) return;
  const visW = aj.fw / aj.scale;
  const outW = Math.min(1600, Math.max(400, Math.round(visW)));
  const outH = Math.round(outW * aj.fh / aj.fw);
  const cv = document.createElement('canvas');
  cv.width = outW; cv.height = outH;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0a2744';
  ctx.fillRect(0, 0, outW, outH);
  const k = outW / aj.fw;
  ctx.drawImage(aj.img, aj.x * k, aj.y * k, aj.nw * aj.scale * k, aj.nh * aj.scale * k);
  const dataUrl = cv.toDataURL('image/jpeg', 0.9);
  fotoBase64 = dataUrl.split(',')[1];
  fotoMediaType = 'image/jpeg';
}

(function iniciarAjuste() {
  const frame = document.getElementById('molduraFoto');
  const el = document.getElementById('previewFoto');
  frame.style.touchAction = 'none';

  frame.addEventListener('pointerdown', (e) => {
    if (!aj.img) return;
    frame.setPointerCapture(e.pointerId);
    aj.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (aj.ptrs.size === 2) {
      const [p, q] = [...aj.ptrs.values()];
      aj.pinch0 = { d: Math.hypot(p.x - q.x, p.y - q.y), s: aj.scale };
    }
  });
  frame.addEventListener('pointermove', (e) => {
    if (!aj.img || !aj.ptrs.has(e.pointerId)) return;
    const ant = aj.ptrs.get(e.pointerId);
    aj.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (aj.ptrs.size === 1) {
      aj.x += e.clientX - ant.x; aj.y += e.clientY - ant.y;
      ajRender();
    } else if (aj.ptrs.size === 2 && aj.pinch0) {
      const [p, q] = [...aj.ptrs.values()];
      const r = frame.getBoundingClientRect();
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      ajZoomPara(aj.pinch0.s * d / aj.pinch0.d, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top);
    }
  });
  const fim = (e) => {
    if (!aj.ptrs.has(e.pointerId)) return;
    aj.ptrs.delete(e.pointerId);
    if (aj.ptrs.size < 2) aj.pinch0 = null;
    if (aj.ptrs.size === 0) ajAplicar();
  };
  frame.addEventListener('pointerup', fim);
  frame.addEventListener('pointercancel', fim);
  frame.addEventListener('wheel', (e) => {
    if (!aj.img) return;
    e.preventDefault();
    const r = frame.getBoundingClientRect();
    ajZoomPara(aj.scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
    ajAplicar();
  }, { passive: false });

  document.getElementById('zoomFoto').addEventListener('input', (e) => {
    if (!aj.img) return;
    const nova = aj.min * Math.pow(aj.max / aj.min, e.target.value / 100);
    ajZoomPara(nova, aj.fw / 2, aj.fh / 2);
  });
  document.getElementById('zoomFoto').addEventListener('change', ajAplicar);
  document.getElementById('btnRestaurarFoto').addEventListener('click', ajReiniciar);
})();

function processarFoto(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const img = new Image();
    img.onload = () => {
      aj.img = img; aj.nw = img.naturalWidth; aj.nh = img.naturalHeight;
      const el = document.getElementById('previewFoto');
      // Mostra a imagem em tamanho natural; o ajuste é feito por transform (arrastar/zoom)
      el.style.cssText = `display:block; position:absolute; left:0; top:0; width:${aj.nw}px; height:${aj.nh}px; max-width:none; object-fit:fill; transform-origin:0 0; touch-action:none; user-select:none; -webkit-user-drag:none;`;
      el.draggable = false;
      el.src = dataUrl;
      document.getElementById('placeholderFoto').style.display = 'none';
      document.getElementById('painelAjuste').style.display = 'block';
      document.getElementById('btnExtrair').style.display = 'flex';
      ajReiniciar();
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  e.target.value = ''; // permite escolher a mesma foto de novo
}

async function extrairComIA() {
  const btn = document.getElementById('btnExtrair');
  setBtnLoading(btn, true);

  try {
    const { data: extraido, error } = await sb.functions.invoke('csd-ler-medidor', {
      body: { imagem_base64: fotoBase64, media_type: fotoMediaType }
    });
    if (error || extraido?.erro) throw error || new Error(extraido.erro);

    document.getElementById('numeroSerie').value = extraido.numero_serie || '';
    document.getElementById('leituraM3').value = extraido.leitura_m3 || '';
    document.getElementById('camposLeitura').style.display = 'block';
    document.getElementById('btnSalvar').disabled = false;
    toast('Leitura extraída — confira antes de salvar.', 'success');
  } catch (err) {
    toast('Não consegui ler automaticamente. Preencha manualmente.', 'error');
    document.getElementById('camposLeitura').style.display = 'block';
    document.getElementById('btnSalvar').disabled = false;
  }

  setBtnLoading(btn, false, 'Ler com IA');
}

async function salvarLeitura() {
  if (!unidadeId) { toast('Selecione a unidade.', 'error'); return; }
  const btn = document.getElementById('btnSalvar');
  setBtnLoading(btn, true);

  try {
    let fotoUrl = null;
    if (fotoBase64) {
      const nomeArquivo = `medidores/${unidadeId}-${Date.now()}.jpg`;
      const bytes = Uint8Array.from(atob(fotoBase64), c => c.charCodeAt(0));
      const { error: erroUpload } = await sb.storage.from('csd-fotos').upload(nomeArquivo, bytes, { contentType: fotoMediaType || 'image/jpeg' });
      if (!erroUpload) {
        fotoUrl = sb.storage.from('csd-fotos').getPublicUrl(nomeArquivo).data.publicUrl;
      }
    }

    const { error } = await sb.from('csd_medidores').insert({
      unidade_id: unidadeId,
      numero_serie: document.getElementById('numeroSerie').value.trim() || null,
      leitura_m3: parseFloat((document.getElementById('leituraM3').value || '0').replace(',', '.')) || null,
      foto_url: fotoUrl,
      latitude: coordenadas?.lat || null,
      longitude: coordenadas?.lng || null,
      capturado_por_tipo: perfilAtual.tipo,
      capturado_por_id: perfilAtual.id,
      capturado_em: new Date().toISOString(),
    });

    if (error) throw error;
    toast('Leitura salva com sucesso!', 'success');
    setTimeout(() => history.back(), 1000);
  } catch (err) {
    toast('Erro ao salvar. Tente novamente.', 'error');
    setBtnLoading(btn, false, 'Salvar leitura');
  }
}

iniciar();
</script>
</body>
</html>
