<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Conta Sim Digital — Consigaz</title>
<link rel="stylesheet" href="assets/css/style.css?v=78">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--navy-900);">
<div class="app-shell" style="background: var(--navy-900); justify-content: center;">
  <div class="screen" style="justify-content: center;">

    <div class="center-text" style="margin-bottom: 32px;">
      <div class="logo-header lg" style="margin-bottom: 20px; justify-content: center; display: flex;">
        <img src="assets/img/logo-consigaz-branca.png" alt="Consigaz">
      </div>
      <h1 style="color:#fff;">Conta Sim Digital</h1>
      <p style="color: rgba(255,255,255,0.7);">Cadastro e medição digital para consultores</p>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="mudarAba('login')">Entrar</div>
        <div class="tab" id="tabCadastro" onclick="mudarAba('cadastro')">Criar conta</div>
      </div>

      <!-- LOGIN -->
      <form id="formLogin">
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      </form>

      <!-- CADASTRO -->
      <form id="formCadastro" style="display:none;">
        <div class="field">
          <label for="cadNome">Nome completo</label>
          <input type="text" id="cadNome" required autocomplete="name">
        </div>

        <div class="field">
          <label for="cadTelefone">Telefone</label>
          <input type="tel" id="cadTelefone" autocomplete="tel">
        </div>

        <div class="field">
          <label for="cadEmail">E-mail</label>
          <input type="email" id="cadEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="cadConfirmarEmail">Confirmar e-mail</label>
          <input type="email" id="cadConfirmarEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="cadSenha">Senha</label>
          <input type="password" id="cadSenha" required minlength="6" autocomplete="new-password">
          <div class="hint">Mínimo de 6 caracteres.</div>
        </div>
        <div class="field">
          <label for="cadConfirmarSenha">Confirmar senha</label>
          <input type="password" id="cadConfirmarSenha" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnCadastro">Criar minha conta</button>
      </form>
    </div>

    <p class="center-text" style="color: rgba(255,255,255,0.5); font-size:13px;">Consigaz Distribuidora de Gás LTDA</p>
    <p class="center-text" style="color: rgba(255,255,255,0.35); font-size:12px; margin-top:-8px;">© 2026 Diogo Soares. Todos os direitos reservados.</p>
  </div>
</div>

<script src="assets/js/supabase-client.js?v=78"></script>
<script>
function mudarAba(aba) {
  document.getElementById('tabLogin').classList.toggle('active', aba === 'login');
  document.getElementById('tabCadastro').classList.toggle('active', aba === 'cadastro');
  document.getElementById('formLogin').style.display = aba === 'login' ? 'block' : 'none';
  document.getElementById('formCadastro').style.display = aba === 'cadastro' ? 'block' : 'none';
}

// Se já tiver sessão ativa, manda direto pro painel
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'painel.html';
})();

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  setBtnLoading(btn, true);
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  setBtnLoading(btn, false, 'Entrar');
  if (error) {
    toast('E-mail ou senha incorretos.', 'error');
    return;
  }
  window.location.href = 'painel.html';
});

document.getElementById('formCadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnCadastro');
  setBtnLoading(btn, true);

  const nome = document.getElementById('cadNome').value.trim();
  const email = document.getElementById('cadEmail').value.trim();
  const confirmarEmail = document.getElementById('cadConfirmarEmail').value.trim();
  const senha = document.getElementById('cadSenha').value;
  const confirmarSenha = document.getElementById('cadConfirmarSenha').value;
  const telefone = document.getElementById('cadTelefone').value.trim();

  if (email.toLowerCase() !== confirmarEmail.toLowerCase()) {
    toast('Os e-mails não são iguais. Confira e tente de novo.', 'error');
    setBtnLoading(btn, false, 'Criar minha conta');
    return;
  }

  if (senha !== confirmarSenha) {
    toast('As senhas não são iguais. Confira e tente de novo.', 'error');
    setBtnLoading(btn, false, 'Criar minha conta');
    return;
  }

  const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email, password: senha });
  if (signUpError) {
    toast(signUpError.message.includes('already') ? 'Este e-mail já está cadastrado.' : 'Erro ao criar conta.', 'error');
    setBtnLoading(btn, false, 'Criar minha conta');
    return;
  }

  // Garante sessão ativa (se confirmação de e-mail estiver desligada, já vem logado)
  if (!signUpData.session) {
    await sb.auth.signInWithPassword({ email, password: senha });
  }

  // Confirma que a sessão está mesmo disponível antes de prosseguir (evita corrida
  // entre o cadastro no Auth e a chamada seguinte, que depende do usuário autenticado)
  let sessaoPronta = null;
  for (let tentativa = 0; tentativa < 15 && !sessaoPronta; tentativa++) {
    const { data: { session } } = await sb.auth.getSession();
    sessaoPronta = session;
    if (!sessaoPronta) await new Promise(r => setTimeout(r, 350));
  }
  if (!sessaoPronta) {
    toast('Conta criada, mas a sessão demorou a iniciar. Tente fazer login normalmente.', 'error');
    setBtnLoading(btn, false, 'Criar minha conta');
    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    return;
  }

  const { data, error } = await sb.rpc('csd_rpc_signup_consultor', { p_nome: nome, p_telefone: telefone });
  if (error || data?.erro) {
    toast('Erro ao finalizar cadastro: ' + (error?.message || data?.erro || 'desconhecido'), 'error');
    setBtnLoading(btn, false, 'Criar minha conta');
    return;
  }
  toast('Conta criada com sucesso!', 'success');

  setTimeout(() => { window.location.href = 'painel.html'; }, 1200);
});
</script>
</body>
</html>
