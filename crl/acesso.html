<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRL — Acesso restrito</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#1f2430;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header{background:#1e2128;color:white;padding:17px 22px;font-weight:800}header b{color:#f03443;font-size:25px}main{max-width:960px;margin:25px auto;padding:0 15px}.panel{background:white;border-radius:15px;border:1px solid #e0e4ea;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #2028400a}.login{max-width:425px;margin:9vh auto}h1{font-size:23px;margin:0 0 8px}p{color:#667085;line-height:1.45}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #cfd5de;border-radius:9px;font:inherit}textarea{min-height:95px}button{padding:11px 15px;border:0;background:#ed2a3b;color:white;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.note{background:#fff3da;color:#7e5316;padding:12px;border-radius:9px;font-size:13px}.hide{display:none}.muted{font-size:12px;color:#667085}.item{padding:13px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0}.tabs{display:flex;gap:7px;margin:16px 0;flex-wrap:wrap}.tabs button{background:#e9ebef;color:#252934}.tabs button.active{background:#ed2a3b;color:white}.danger{color:#c02632}.success{color:#14814b}.subtle{font-size:12px;color:#64748b}.item button{padding:8px 11px;font-size:12px;margin-top:7px}.radio-group{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.radio-group label{display:inline-flex;align-items:center;gap:5px;margin:0;font-weight:500}.radio-group input{width:auto;display:inline}.meter{background:#f2f4f7;border-radius:10px;padding:12px;margin:12px 0}.meter strong{font-size:22px;color:#e92b3b}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid #edf0f2;background:#f8f9fb;border-radius:10px;padding:12px}.metric b{font-size:23px;display:block;color:#e92b3b}.metric small{color:#667085}@media print{header,.tabs,#formArea,#notice,#logout,.note,#identity{display:none!important}.grid{display:block!important}.grid>.panel:first-child{display:none!important}.panel{box-shadow:none;border:0!important}main{max-width:none}}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:16px}.login{margin:25px auto}}
</style></head><body><header>⌂ <b>CRL</b> — Caminho de Retorno ao Lar</header><main>
<section id="loginPanel" class="panel login"><h1>Entrar no sistema</h1><p>Acesso de ADM e monitor por nome de usuário e senha.</p><form id="loginForm"><label>Usuário</label><input id="username" required autocomplete="username" pattern="[a-zA-Z0-9._-]{3,60}" placeholder="Nome de acesso"><label>Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha"><button id="loginButton" style="width:100%;margin-top:18px">Entrar</button></form><p id="loginMessage" role="status"></p><div class="note">Ambiente em homologação. Não registre dados reais de acolhidos até a liberação oficial.</div></section>
<section id="appPanel" class="hide"><div class="panel"><div class="row"><div><h1>Gestão CRL</h1><p id="identity"></p></div><button id="logout">Sair</button></div><div class="note">Primeira integração. Somente dados fictícios durante os testes.</div></div><div class="tabs"><button data-view="students" class="active">Acolhidos</button><button data-view="files">Arquivos</button><button data-view="history" id="tabHistory" style="display:none">Histórico e retornos (ADM)</button><button data-view="notes">Rotina</button><button data-view="trips">Veículo</button><button data-view="devotionals">Devocionais</button><button data-view="meals">Refeições</button><button data-view="contributions" id="tabContributions" style="display:none">Contribuições (ADM)</button><button data-view="stats" id="tabStats" style="display:none">Estatísticas ADM</button></div><div class="grid"><div class="panel" id="formArea"></div><div class="panel"><h2 id="listTitle">Registros</h2><div id="listArea">Carregando...</div></div></div><p id="notice" role="status"></p></section>
</main><script type="module" src="./acesso.js"></script></body></html>
