<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRL — Acesso restrito</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#1f2430;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header{background:#1e2128;color:white;padding:17px 22px;font-weight:800}header b{color:#f03443;font-size:25px}main{max-width:960px;margin:25px auto;padding:0 15px}.panel{background:white;border-radius:15px;border:1px solid #e0e4ea;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #2028400a}.login{max-width:425px;margin:9vh auto}h1{font-size:23px;margin:0 0 8px}p{color:#667085;line-height:1.45}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #cfd5de;border-radius:9px;font:inherit}textarea{min-height:95px}button{padding:11px 15px;border:0;background:#ed2a3b;color:white;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.note{background:#fff3da;color:#7e5316;padding:12px;border-radius:9px;font-size:13px}.hide{display:none}.muted{font-size:12px;color:#667085}.item{padding:13px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0}.tabs{display:flex;gap:7px;margin:16px 0;flex-wrap:wrap}.tabs button{background:#e9ebef;color:#252934}.tabs button.active{background:#ed2a3b;color:white}.manager-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.manager-actions button{background:#f1f2f5;color:#242932;border:1px solid #ddd}.manager-actions button.warn{color:#a62636;background:#fff1f2}.code-label{font-family:ui-monospace,monospace;font-size:12px;color:#475467;margin:4px 0}.danger{color:#c02632}.success{color:#14814b}.subtle{font-size:12px;color:#64748b}.item button{padding:8px 11px;font-size:12px;margin-top:7px}.radio-group{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.radio-group label{display:inline-flex;align-items:center;gap:5px;margin:0;font-weight:500}.radio-group input{width:auto;display:inline}.meter{background:#f2f4f7;border-radius:10px;padding:12px;margin:12px 0}.meter strong{font-size:22px;color:#e92b3b}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid #edf0f2;background:#f8f9fb;border-radius:10px;padding:12px}.metric b{font-size:23px;display:block;color:#e92b3b}.metric small{color:#667085}@media print{header,.tabs,#formArea,#notice,#logout,.note,#identity{display:none!important}.grid{display:block!important}.grid>.panel:first-child{display:none!important}.panel{box-shadow:none;border:0!important}main{max-width:none}}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:16px}.login{margin:25px auto}}

/* CRL identidade visual — versão responsiva em evolução */
:root{--crl-red:#f12a39;--crl-dark:#171b24;--crl-muted:#687385;--crl-line:#e5e9f0;--crl-bg:#f5f6f9}
body{background:var(--crl-bg);color:#202535;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(115deg,#161a22,#292e38);border-bottom:3px solid var(--crl-red);min-height:78px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;box-shadow:0 4px 22px #0d13231c}
header b{font-size:30px;letter-spacing:-.055em}
main{max-width:1210px;margin:28px auto;padding:0 20px}
.panel{border-radius:18px;padding:25px;border:1px solid var(--crl-line);box-shadow:0 4px 20px #17213709}
h1{letter-spacing:-.04em;font-weight:800}h2{font-size:19px;letter-spacing:-.035em;margin-top:0}
p{line-height:1.55}
button{transition:background .15s,transform .15s,box-shadow .15s;border-radius:10px;background:var(--crl-red);min-height:43px}
button:hover{filter:brightness(.95)}button:active{transform:scale(.985)}
input,select,textarea{background:#fbfcfe;border-color:#d9dee7;border-radius:10px;min-height:44px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--crl-red);box-shadow:0 0 0 3px #f12a391c}
.tabs{gap:8px;padding:4px 0 6px;overflow-x:auto;scrollbar-width:thin;flex-wrap:nowrap;margin:10px 0 20px}
.tabs button{flex-shrink:0;white-space:nowrap;border:1px solid #e2e6ed;background:#fff;border-radius:12px;min-height:45px;font-size:13px;padding:10px 15px;font-weight:700;box-shadow:0 2px 6px #1c26350a}
.tabs button.active{background:var(--crl-dark);color:white;border-color:var(--crl-dark);box-shadow:inset 0 -3px 0 var(--crl-red)}
.grid{gap:18px}.item{border:1px solid #e6eaf0;background:#fbfcfe;border-radius:13px;padding:15px}.item b{color:#252a34}
.note{border-left:4px solid #eab04c;background:#fff8eb;color:#6c520f}
.metric{border-radius:14px;padding:17px}.metric b{color:var(--crl-red);font-size:27px}
.manager-actions button.warn{border-color:#f3c2c6}.manager-actions button{min-height:36px}
.login{margin:7vh auto;max-width:440px;padding:30px}
@media(max-width:720px){
  header{min-height:66px;padding:12px 18px;font-size:13px}header b{font-size:25px}
  main{padding:0 12px;margin:14px auto}.panel{padding:18px 16px;border-radius:16px}
  .tabs{margin:4px -2px 14px;padding:6px 2px 10px}.tabs button{font-size:12px;padding:9px 12px}
  .grid{gap:13px}.metric-grid{gap:8px}.metric{padding:12px}.metric b{font-size:22px}
  .login{margin:4vh auto}
}
</style></head><body><header>⌂ <b>CRL</b> — Caminho de Retorno ao Lar</header><main>
<section id="loginPanel" class="panel login"><h1>Entrar no sistema</h1><p>Acesso de ADM e monitor por nome de usuário e senha.</p><form id="loginForm"><label>Usuário</label><input id="username" required autocomplete="username" pattern="[a-zA-Z0-9._-]{3,60}" placeholder="Nome de acesso"><label>Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha"><button id="loginButton" style="width:100%;margin-top:18px">Entrar</button></form><p id="loginMessage" role="status"></p><div class="note">Ambiente em homologação. Não registre dados reais de acolhidos até a liberação oficial.</div></section>
<section id="appPanel" class="hide"><div class="panel"><div class="row"><div><h1>Gestão CRL</h1><p id="identity"></p></div><button id="logout">Sair</button></div><div class="note">Primeira integração. Somente dados fictícios durante os testes.</div></div><div class="tabs"><button data-view="students" class="active">Acolhidos</button><button data-view="files">Arquivos</button><button data-view="history" id="tabHistory" style="display:none">Histórico e retornos (ADM)</button><button data-view="notes">Rotina</button><button data-view="trips">Veículo</button><button data-view="devotionals">Devocionais</button><button data-view="meals">Refeições</button><button data-view="contributions" id="tabContributions" style="display:none">Contribuições (ADM)</button><button data-view="monitors" id="tabMonitors" style="display:none">Monitores (ADM)</button><button data-view="stats" id="tabStats" style="display:none">Estatísticas ADM</button></div><div class="grid"><div class="panel" id="formArea"></div><div class="panel"><h2 id="listTitle">Registros</h2><div id="listArea">Carregando...</div></div></div><p id="notice" role="status"></p></section>
</main><script type="module" src="./acesso.js"></script></body></html>
