<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Ocorrências · Pós-Vendas</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ocorrências">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#0f1b2d; --muted:#64748b; --line:#e3e8ef;
  --navy:#0b1f3a; --blue:#1d4ed8; --blue-soft:#e8efff;
  --red:#dc2626; --red-soft:#fde8e8; --orange:#ea580c; --orange-soft:#fff0e5;
  --yellow:#ca8a04; --yellow-soft:#fef7d6; --green:#16a34a; --green-soft:#e4f6ea;
  --purple:#7c3aed; --purple-soft:#f1eaff;
  --r:14px; --shadow:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,#1d4ed8 0,#0b1f3a 55%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border .15s}
.input:focus{border-color:var(--blue)}
.pin-row{display:flex;gap:10px}
.pin-box{width:56px;height:60px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:12px;outline:none;-webkit-text-security:disc}
.pin-box:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin:4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn.block{width:100%;white-space:normal;text-align:center}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}

/* ---------- layout ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topbar .brand{font-weight:750;font-size:16px;letter-spacing:.01em;flex:1;min-width:0}
.topbar .brand small{display:block;font-weight:500;font-size:12px;opacity:.7}
.topbar .btn{background:rgba(255,255,255,.12);color:#fff}
.side{display:none}
main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--blue)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px}
@media (min-width:900px){
  .topbar{display:none}
  .tabs{display:none}
  #app{display:grid;grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;align-self:start;background:var(--navy);color:#fff;padding:22px 14px}
  .side .brand{font-weight:800;font-size:17px;padding:0 10px 20px}
  .side .brand small{display:block;font-weight:500;font-size:12px;opacity:.65;margin-top:2px}
  .side .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;color:rgba(255,255,255,.72);padding:11px 12px;border-radius:10px}
  .side .tab.on{background:rgba(255,255,255,.12);color:#fff}
  .side .tab .dot{position:static;margin-left:auto}
  .side .foot{margin-top:auto;font-size:12.5px;opacity:.7;padding:10px}
  .side .foot button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
  main{padding:28px 32px 48px}
}

/* ---------- common ---------- */
h2.page{font-size:22px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g4{grid-template-columns:1fr 1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--line);color:var(--ink);border-radius:20px;padding:0 8px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:650;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)} .p-orange{background:var(--orange-soft);color:var(--orange)}
.p-yellow{background:var(--yellow-soft);color:var(--yellow)} .p-green{background:var(--green-soft);color:var(--green)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-purple{background:var(--purple-soft);color:var(--purple)}
.p-gray{background:#eef1f5;color:#475569}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input{flex:1 1 180px;padding:10px 12px}
.toolbar select.input{flex:0 1 200px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* ---------- metas ---------- */
.goal{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:28px;font-weight:800;line-height:1}
.ring .of{font-size:12.5px;color:var(--muted);margin-top:3px}
.goal h3{margin:0 0 4px;font-size:16px}
.goal .falta{font-size:15px;margin:2px 0}
.goal .falta b{font-size:20px}
.goal .hint{color:var(--muted);font-size:13px}
.goal.star{background:linear-gradient(135deg,#fff 0,#fff 55%,#f4efff 100%)}
.kpi{padding:14px}
.kpi .n{font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi.red .n{color:var(--red)} .kpi.orange .n{color:var(--orange)} .kpi.green .n{color:var(--green)} .kpi.purple .n{color:var(--purple)}
.kpi{cursor:pointer;transition:transform .12s}
.kpi:active{transform:scale(.98)}
.month-sel{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.month-sel select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:650}

/* ---------- ocorrência cards ---------- */
.oc{display:flex;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border-left:5px solid var(--line)}
.oc.s-red{border-left-color:var(--red)} .oc.s-orange{border-left-color:var(--orange)} .oc.s-yellow{border-left-color:var(--yellow)} .oc.s-green{border-left-color:var(--green)} .oc.s-done{border-left-color:#94a3b8}
.oc .body{flex:1;min-width:0}
.oc .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.oc .name{font-weight:700;font-size:15.5px;margin:2px 0;overflow-wrap:anywhere;cursor:pointer}
.oc .meta{color:var(--muted);font-size:13px;display:flex;gap:4px 12px;flex-wrap:wrap}
.oc .meta b{color:var(--ink);font-weight:650}
.oc .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.oc .due{text-align:right;flex:none;min-width:74px}
.oc .due .d{font-size:22px;font-weight:800;line-height:1}
.oc .due .u{font-size:11.5px;color:var(--muted);font-weight:600}
.oc .chk{width:22px;height:22px;accent-color:var(--blue);margin-top:2px;flex:none}
.ico{width:16px;height:16px;flex:none}

/* ---------- bars ---------- */
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer}
.bars .row:hover{background:#f6f8fb}
.bars .row.on{background:var(--blue-soft)}
.bars .lbl{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .val{font-weight:800;font-size:14px}
.bars .track{grid-column:1/-1;height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--blue);border-radius:6px}
.bars .row.rel .fill{background:var(--purple)}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.modal h3{margin:0 0 2px;font-size:19px}
.modal .x{float:right;border:0;background:#eef1f5;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-grid .field{margin:0}
.info-box{background:var(--yellow-soft);color:#7a5a00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.hist{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px}
.hist:first-child{border-top:0}
.sol{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap}

/* ---------- import ---------- */
.drop{border:2px dashed #b9c4d4;border-radius:16px;padding:28px 16px;text-align:center;background:#fff;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:650;font-size:12px;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.route-bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.route-bar .btn{background:#fff;color:var(--navy)}
@media (min-width:900px){.route-bar{left:272px;right:32px;bottom:20px;max-width:900px}}

/* ---------- correções / navegação ---------- */
html,body{overflow-x:clip}
main{min-width:0;overflow-x:clip}
.drop{display:block}
.drop b{font-size:16px}
.back{border:0;background:none;color:var(--blue);font-weight:700;font-size:15px;padding:4px 0 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clk{cursor:pointer;transition:transform .12s}
.clk:active{transform:scale(.985)}
@media (max-width:699px){
  .toolbar .input,.toolbar select.input{flex:1 1 100%}
  .goal{gap:12px}.ring{width:96px;height:96px}.ring svg{width:96px;height:96px}
  .oc{padding:12px 10px}
}
.cli-row{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.cli-row:last-child{border-bottom:0}
.cli-row:active{background:#f6f8fb}
.cli-main{flex:1;min-width:0}
.cli-nome{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.cli-sub{color:var(--muted);font-size:13px;margin-top:2px}
.cli-sub b{color:var(--ink)}
.chev{color:#94a3b8;font-size:20px}

/* ---------- relatório ---------- */
.rel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:28px 26px;margin-top:8px;color:#0f1b2d}
.rel h1{margin:2px 0 4px;font-size:26px}
.rel h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:#334155;margin:26px 0 10px;border-bottom:2px solid #0b1f3a;padding-bottom:6px}
.rel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:4px solid #0b1f3a;padding-bottom:14px}
.rel-kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1d4ed8}
.rel-meta{color:#475569;font-size:14px}
.rel-date{text-align:right;font-size:12px;color:#64748b}
.rel-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rel-kpis.k3{margin-top:0}
.rel-kpis div{border:1px solid #e3e8ef;border-left:4px solid #1d4ed8;border-radius:10px;padding:10px 12px}
.rel-kpis div.pu{border-left-color:#7c3aed}.rel-kpis div.rd{border-left-color:#dc2626}.rel-kpis div.or{border-left-color:#ea580c}
.rel-kpis b{display:block;font-size:26px;line-height:1.1}
.rel-kpis span{font-size:12px;color:#64748b;font-weight:600}
.rel-chart{position:relative;display:flex;gap:10px;align-items:flex-end;height:176px;padding:0 4px;border-bottom:1px solid #cbd5e1;margin-bottom:6px}
.rel-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;max-width:90px}
.rel-chart .bars2{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.rel-chart .bt,.rel-chart .br{width:42%;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.rel-chart .bt{background:#1d4ed8}.rel-chart .br{background:#7c3aed}
.rel-chart .bt span,.rel-chart .br span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#0f1b2d}
.rel-chart .cl{height:26px;line-height:26px;font-size:11.5px;font-weight:700;color:#475569}
.meta-line{position:absolute;left:0;right:0;border-top:2px dashed #1d4ed8;opacity:.55}
.meta-line.pu{border-color:#7c3aed}
.meta-line span{position:absolute;right:0;top:-15px;background:#fff;padding:0 4px;font-size:10px;font-weight:800;color:#1d4ed8}
.meta-line.pu span{color:#7c3aed}
.legend{display:flex;gap:16px;font-size:12px;color:#475569;margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lb{background:#1d4ed8}.lp{background:#7c3aed}
.rt{width:100%;border-collapse:collapse;font-size:12.5px}
.rt th{font-size:11px;text-transform:uppercase;color:#64748b;text-align:left;padding:6px 6px;border-bottom:1px solid #cbd5e1}
.rt td{padding:5px 6px;border-bottom:1px solid #eef1f5}
.rt .r{text-align:right}
.rt .mu,.mu{color:#94a3b8}
.rt tr.hl td{background:#f1eaff}
.rt tr.tot td{font-weight:800;border-top:2px solid #0b1f3a;border-bottom:0}
.ok{color:#16a34a;font-weight:800}.no{color:#dc2626;font-weight:700}
.rel-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rel-foot{margin-top:24px;padding-top:10px;border-top:1px solid #e3e8ef;font-size:11px;color:#94a3b8}
.mtx-wrap{overflow-x:auto}
@media (max-width:699px){
  .rel{padding:18px 14px}.rel h1{font-size:21px}
  .rel-kpis{grid-template-columns:1fr 1fr}.rel-kpis.k3{grid-template-columns:repeat(3,1fr)}
  .rel-2col{grid-template-columns:1fr;gap:0}
  .rel .mtx{font-size:10.5px}.rel .mtx td,.rel .mtx th{padding:4px 3px}
}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .side,.topbar,.tabs,.no-print,#rotaBar,.toast,#modalRoot{display:none!important}
  #app{display:block!important}
  main{padding:0!important;max-width:none!important;overflow:visible!important}
  .rel{box-shadow:none;border-radius:0;padding:0;margin:0}
  .rel-kpis{grid-template-columns:repeat(3,1fr)!important}
  .rel-kpis.k3{grid-template-columns:repeat(3,1fr)!important}
  .rel-2col{grid-template-columns:1fr 1fr!important;gap:20px!important}
  .rel .mtx{font-size:10px!important}
  h3,.rel-chart,table tr,.rel-kpis{break-inside:avoid}
  h3{break-after:avoid}
  h3.pb{break-before:page}
}

/* ---------- reaberturas ---------- */
.reab-card{display:flex;gap:16px;align-items:center;border-left:6px solid var(--green)}
.reab-card.r-yellow{border-left-color:var(--yellow)}.reab-card.r-orange{border-left-color:var(--orange);background:linear-gradient(90deg,#fff 60%,#fff4ea)}
.reab-card.r-red{border-left-color:var(--red);background:linear-gradient(90deg,#fff 50%,#fdeaea)}
.reab-n{font-size:40px;font-weight:900;line-height:1;min-width:84px;text-align:center}
.reab-n small{font-size:16px;color:var(--muted);font-weight:700}
.r-green .reab-n{color:var(--green)}.r-yellow .reab-n{color:var(--yellow)}.r-orange .reab-n{color:var(--orange)}.r-red .reab-n{color:var(--red)}
.reab-track{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;margin-top:8px;max-width:320px}
.reab-track div{height:100%;background:currentColor}
.r-green .reab-track div{background:var(--green)}.r-yellow .reab-track div{background:var(--yellow)}.r-orange .reab-track div{background:var(--orange)}.r-red .reab-track div{background:var(--red)}
.reab-chart{position:relative;display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:6px}
.reab-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.reab-chart .bx{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.reab-chart .b{width:70%;max-width:34px;border-radius:5px 5px 0 0;position:relative;min-height:3px}
.reab-chart .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800}
.b-green{background:var(--green)}.b-yellow{background:#eab308}.b-orange{background:var(--orange)}.b-red{background:var(--red)}
.reab-chart .cl{height:24px;line-height:24px;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.reab-chart .cl.on{color:var(--ink);text-decoration:underline}
.reab-chart .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--red);opacity:.7;pointer-events:none}
.reab-chart .lim span{position:absolute;right:0;top:-15px;font-size:10px;font-weight:800;color:var(--red);background:#fff;padding:0 4px}
.reab-item>.pill{margin:6px 0 4px}
.rel-kpis div.rd b{color:#dc2626}

/* ---------- rota por cidade ---------- */
.cid-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cid{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.cid b{font-size:14.5px}.cid span{font-size:12.5px;color:var(--muted)}.cid em{font-style:normal;color:var(--red);font-weight:700}
.cid.on{border-color:var(--blue);background:var(--blue-soft)}
.cid:active{transform:scale(.98)}
.rota-go{margin-top:12px;border-left:5px solid var(--blue)}
.parada{display:flex;gap:10px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;align-items:flex-start}
.parada.fora{opacity:.45}
.parada .pn{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.parada .body{flex:1;min-width:0}
.parada .name{font-weight:700;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.parada .meta{color:var(--muted);font-size:13px;margin-top:2px}
.parada .top{display:flex;flex-wrap:wrap;gap:4px}
.parada .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- anotações e fotos ---------- */
.ficha-acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.nota{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.nota.irr{border-left-color:var(--red);background:#fffafa}
.nota-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nota .lnk{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}
.irr-d{color:var(--red);font-weight:600}
.chk-line{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.chk-line input{width:20px;height:20px;accent-color:var(--blue)}
.seg{display:flex;background:#eef1f5;border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;min-width:0;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.red{color:var(--red)}
.foto-prog{margin-top:12px;font-size:14px}
.slots{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.slots{grid-template-columns:1fr 1fr}}
.slot{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;border-left:5px solid var(--line)}
.slot.tem{border-left-color:var(--green)}
.slot-h{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;margin-bottom:8px}
.slot-h small{background:var(--line);border-radius:10px;padding:0 8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#eef1f5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{display:grid;place-items:center;height:100%;font-size:22px}
.thumb .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.thumb .exp{position:absolute;left:0;right:0;bottom:0;background:rgba(22,163,74,.85);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px}
.add{width:96px;height:96px;border:2px dashed #b9c4d4;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--blue);background:#f8faff}
.add span{font-size:26px}.add small{font-weight:700;font-size:12px}
.add.mais{border-style:solid;border-color:var(--blue-soft);background:var(--blue-soft)}
.add.mais span{font-size:30px;font-weight:300}

/* ---------- guia ---------- */
.guia-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.guia-item{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.guia-item b{font-size:14.5px}.guia-item span{font-size:12.5px;color:var(--muted)}.guia-item em{font-style:normal;color:var(--orange);font-weight:700}
.guia-acao{border-left:5px solid #0b1f3a;font-size:14.5px;line-height:1.55}
.guia-acao .lnk,.lnk{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px}
.dicas{margin-top:10px;background:var(--yellow-soft);color:#7a5a00;border-radius:10px;padding:8px 10px;font-size:13.5px}
.gform{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.gform{grid-template-columns:1fr 1fr}}
.gform .full{grid-column:1/-1}
.gq label{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:5px}
.seg.sm button{padding:7px 4px}
#guiaTxt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}
details.ex{margin-bottom:8px}
details.ex summary{cursor:pointer;font-size:14px}
.guia-cta{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:0;text-align:left;background:linear-gradient(90deg,#0b1f3a,#1d4ed8);color:#fff}
.guia-cta span{font-size:28px}.guia-cta b{display:block;font-size:15.5px}.guia-cta small{opacity:.85;font-size:12.5px}.guia-cta em{margin-left:auto;font-style:normal;font-size:22px}
.mu{color:var(--muted)}

.oc.visitada{background:linear-gradient(90deg,#fff 70%,#effaf3)}
.salvo{background:var(--green-soft);color:#166534;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;font-weight:600}
.base-line{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.base-line b{color:var(--ink)}

.cc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.cc-top{display:flex;gap:8px;align-items:flex-start}
.cc .name{font-weight:700;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.cc .meta{color:var(--muted);font-size:13px;margin-top:2px}.cc .meta b{color:var(--ink)}
.cc .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.cid-sel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin:4px 0 12px;font-size:15px}
.parada-grp{margin-bottom:14px}
.parada-grp.fora{opacity:.5}
.parada-h{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin:0 2px 6px}
.parada-h b{color:var(--ink)}
.parada-h .pn{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.otim-run{display:flex;gap:10px;align-items:center;margin-top:10px;background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:12px;font-weight:650;font-size:14px}
.vis-fora{margin:12px 0;background:var(--green-soft)}
.vis-fora summary{cursor:pointer;font-size:14px;color:#166534}
.vis-fora .oc{margin-top:10px}

/* ---------- medidores ---------- */
.med{display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:10px;margin-bottom:8px;cursor:pointer;border-left:5px solid var(--green)}
.med.dup{border-left-color:var(--red);background:#fffafa}
.med-img{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#eef1f5;display:grid;place-items:center;font-size:26px;flex:none}
.med-img img{width:100%;height:100%;object-fit:cover}
.med-b{flex:1;min-width:0}.med-u{font-weight:800;font-size:15.5px}.med-l{font-size:13.5px;color:var(--muted)}.med-l b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.med-d{font-size:12px;color:var(--muted);margin-top:2px}
.med-foto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2px dashed #b9c4d4;border-radius:14px;background:#f8faff;color:var(--blue);cursor:pointer;margin:6px 0 4px;overflow:hidden;text-align:center;padding:10px}
.med-foto span{font-size:34px}.med-foto small{color:var(--muted)}
.med-foto img{max-width:100%;max-height:260px;border-radius:10px}
.ia-res{background:#f6f8fb;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:8px 0}

.thumb .enviando{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(11,31,58,.45);color:#fff;font-size:11px;font-weight:700;border:0}
.thumb .enviando .spinner{width:18px;height:18px;margin:0;border-width:2px;border-color:rgba(255,255,255,.4);border-top-color:#fff}
.thumb .enviando.erro{background:rgba(220,38,38,.75);cursor:pointer;padding:4px;text-align:center}

.edit-cli{margin:10px 0 12px;background:var(--blue-soft);border-radius:12px;padding:4px 12px}
.edit-cli[open]{background:#f6f8fc;padding-bottom:12px}
.edit-cli summary{cursor:pointer;font-weight:800;padding:10px 0;color:var(--blue);font-size:15px}
.edit-cli summary small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

/* card compacto v2 */
.oc{display:block;padding:12px 12px 10px}
.oc .oc-head{display:flex;align-items:flex-start;gap:8px}
.oc .oc-head .top{flex:1;min-width:0;margin:0}
.oc .chk{width:20px;height:20px;margin:1px 0 0}
.oc .due{flex:none;min-width:0;text-align:right;white-space:nowrap;line-height:1.1}
.oc .due b{font-size:19px;font-weight:800}
.oc .due span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.oc .sub-oc{color:var(--blue);font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.25}
.oc .name{font-size:16px;margin:2px 0 3px;line-height:1.25}
.oc .meta{font-size:12.5px;gap:2px 10px}
.oc .meta.loc{margin-top:1px}
.oc .meta.loc em{font-style:normal;color:#b45309;font-weight:600}
.oc .vis-tag{margin-top:6px;font-size:12px;font-weight:650;color:#15803d;background:#e8f7ee;border-radius:8px;padding:4px 8px;display:inline-block}
.oc .main-acts{display:grid;grid-template-columns:1.35fr 1fr;gap:6px;margin-top:10px}
.oc .main-acts .btn{padding:10px 8px;font-size:13.5px;border-radius:10px;justify-content:center;white-space:nowrap}
.oc .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.oc .tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 2px;border-radius:9px;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;min-width:0}
.oc .tool i{font-style:normal;font-size:19px;line-height:1}
.oc .tool span{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.oc .tool:active,.oc .tool:hover{background:#eef2fb}
.oc .tool.zap span{color:#15803d}
@media(min-width:760px){.oc .main-acts{max-width:440px}.oc .tools{max-width:440px}}

/* rota compacta v2 */
.seg.rf{margin:2px 0 10px}
.seg.rf button{font-size:13px;padding:8px 6px}
.rota-go{margin-top:0;border-left:0;padding:14px}
.rg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.rg-n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px}
.rg-n small,.rg-km small{font-size:14px;font-weight:650;color:var(--muted);letter-spacing:0}
.rg-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.rg-km{font-size:22px;font-weight:800;color:var(--blue);line-height:1;white-space:nowrap}
.rg-path{display:flex;align-items:center;gap:6px;margin:12px 0 2px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.rg-path span{white-space:nowrap}
.rg-path i{flex:1;min-width:10px;border-top:2px dotted #c3cbe0}
.rg-path button{border:0;background:var(--blue-soft);color:var(--blue);font:inherit;font-weight:700;border-radius:20px;padding:4px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.rg-acts{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:12px}
.rg-acts .btn{justify-content:center;padding:12px 10px;font-size:14.5px;border-radius:12px}
.rg-acts .btn.ico{flex-direction:column;gap:1px;padding:6px 10px;min-width:58px;font-size:17px;line-height:1}
.rg-acts .btn.ico small{font-size:10.5px;font-weight:650;color:var(--muted)}
.rg-note{font-size:12px;color:var(--muted);margin-top:7px}
.rg-warn{margin-top:10px;font-size:12px;color:#92400e;background:#fef6e0;border-radius:9px;padding:7px 10px;font-weight:600}
.rg-acts .btn.ico{display:flex;align-self:stretch;height:auto;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.cid-sel{padding:9px 12px;margin:0 0 10px;font-size:14.5px}
.cid-sel .lnk{font-size:14px;white-space:nowrap}
.parada-h{margin:14px 2px 6px}
.parada-h .pn{width:24px;height:24px;font-size:12px}
@media(min-width:760px){.rota-go{max-width:560px}.seg.rf{max-width:560px}}
</style>
</head>

<!-- LOGIN -->
<section id="login" class="hidden">

        <input class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="pin-box" inputmode="numeric" maxlength="1" autocomplete="off">
      </div></div>
    <div class="err" id="lgErr"></div>
    <button class="btn block" id="lgBtn" type="submit">Entrar</button>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side" id="side"></aside>
  <div>
    <header class="topbar">
      <div class="brand">Minhas Ocorrências<small id="topSub">Pós-Vendas</small></div>
      <button class="btn sm" onclick="go('importar')">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Importar</button>
    </header>
    <main id="view"><div class="loading"><div><div class="spinner"></div>Carregando…</div></div></main>
  </div>

</div>

<div id="modalRoot"></div>
